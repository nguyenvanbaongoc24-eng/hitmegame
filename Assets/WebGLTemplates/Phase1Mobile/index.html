<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0f1217; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #unity-container, #unity-fullscreen-container, #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #unity-canvas { outline: none; }
      #unity-loading { position: fixed; inset: 0; display: grid; place-items: center; color: white; font-family: sans-serif; }
      #unity-warning { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; color: #111; }
    </style>
  </head>
  <body>
    <div id="unity-container"><div id="unity-fullscreen-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div></div>
    <div id="unity-loading">Loading HIT ME…</div><div id="unity-warning"></div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      function unityShowBanner(message, type) {
        const banner = document.querySelector("#unity-warning");
        const item = document.createElement("div"); item.textContent = message;
        item.style.cssText = `padding:8px;background:${type === "error" ? "#d33" : "#fc3"}`;
        banner.appendChild(item); if (type !== "error") setTimeout(() => item.remove(), 5000);
      }
      // Safari otherwise interprets a drag over the canvas as page scrolling/zooming.
      ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(type => canvas.addEventListener(type, event => event.preventDefault(), { passive: false }));
      document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
      const buildUrl = "Build";
      // Safari can keep an older .data/.wasm pair after a LAN rebuild because Unity
      // normally uses fixed filenames. A new `v` query forces every build asset to reload.
      const buildVersion = new URLSearchParams(window.location.search).get("v") || "phase1-webgl-20261028-2";
      const versioned = path => path + "?v=" + encodeURIComponent(buildVersion);
      const config = {
        arguments: [], dataUrl: versioned(buildUrl + "/{{{ DATA_FILENAME }}}"), frameworkUrl: versioned(buildUrl + "/{{{ FRAMEWORK_FILENAME }}}"), codeUrl: versioned(buildUrl + "/{{{ CODE_FILENAME }}}"),
        streamingAssetsUrl: "StreamingAssets", companyName: "{{{ COMPANY_NAME }}}", productName: "{{{ PRODUCT_NAME }}}", productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner, matchWebGLToCanvasSize: true
      };
      const script = document.createElement("script"); script.src = versioned(buildUrl + "/{{{ LOADER_FILENAME }}}");
      script.onload = () => createUnityInstance(canvas, config, () => {}).then(instance => { loading.remove(); canvas.focus(); }).catch(error => unityShowBanner(error, "error"));
      document.body.appendChild(script);
    </script>
  </body>
</html>
