<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#241810">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT ME — Game Dân Gian Làng Quê</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #241810;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-fullscreen-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        outline: none;
        display: block;
        touch-action: none;
      }
      #unity-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #241810;
        color: #ffe882;
        font-size: 20px;
        font-weight: bold;
        z-index: 10;
        letter-spacing: 0.5px;
      }
      #unity-warning {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        color: #111;
      }
      #rotate-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #241810;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
      }
      @media screen and (orientation: landscape) and (max-height: 600px) {
        #rotate-notice { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
    </div>
    <div id="unity-loading">Đang tải HIT ME…</div>
    <div id="unity-warning"></div>

    <div id="rotate-notice">
      <div style="font-size: 56px; margin-bottom: 16px;">🔄</div>
      <div style="font-size: 22px; font-weight: bold; color: #f8b920; margin-bottom: 8px;">VUI LÒNG XOAY DỌC MÀN HÌNH</div>
      <div style="font-size: 15px; color: #fff8dc; line-height: 1.4;">Trò chơi được thiết kế tối ưu cho trải nghiệm màn hình dọc điện thoại</div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      function unityShowBanner(message, type) {
        const banner = document.querySelector("#unity-warning");
        const item = document.createElement("div"); item.textContent = message;
        item.style.cssText = `padding:8px;background:${type === "error" ? "#d33" : "#fc3"}`;
        banner.appendChild(item); if (type !== "error") setTimeout(() => item.remove(), 5000);
      }
      document.addEventListener("touchmove", function(e) {
        if (e.target !== canvas) e.preventDefault();
      }, { passive: false });
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
      const buildUrl = "Build";
      const buildVersion = new URLSearchParams(window.location.search).get("v") || "phase1-closed-20261028";
      const versioned = path => path + "?v=" + encodeURIComponent(buildVersion);
      const config = {
        arguments: [], dataUrl: versioned(buildUrl + "/{{{ DATA_FILENAME }}}"), frameworkUrl: versioned(buildUrl + "/{{{ FRAMEWORK_FILENAME }}}"), codeUrl: versioned(buildUrl + "/{{{ CODE_FILENAME }}}"),
        streamingAssetsUrl: "StreamingAssets", companyName: "{{{ COMPANY_NAME }}}", productName: "{{{ PRODUCT_NAME }}}", productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner, matchWebGLToCanvasSize: false, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2.5)
      };
            function updateCanvasResolution() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
      }
      updateCanvasResolution();
      window.addEventListener("resize", updateCanvasResolution);
            const urlParams = new URLSearchParams(window.location.search);
      // E2E Test Bridge Contract (A0: Active ONLY when ?e2e=1, Read-Only)
      if (urlParams.get("e2e") === "1") {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        window.__hitmeState = {
          build: "dev",
          version: "1.0.0",
          screen: "home",
          selectedCharacterId: "nam_lang",
          selectedWeaponId: "dep_to_ong",
          roster: [
            { id: "nam_lang", name: "Nam Làng", enabled: true },
            { id: "nu_nang_dong", name: "Nữ Năng Động", enabled: true },
            { id: "co_ba", name: "Cô Ba", enabled: true },
            { id: "anh_teen", name: "Anh Teen", enabled: true },
            { id: "quay_boy", name: "Quậy Boy", enabled: false },
            { id: "cho_vang", name: "Chó Vàng", enabled: false },
            { id: "meo_mun", name: "Mèo Mun", enabled: false }
          ],
          weapons: [
            { id: "dep_to_ong", name: "Dép Tổ Ong", enabled: true },
            { id: "chao", name: "Chảo", enabled: true },
            { id: "vot", name: "Vợt", enabled: true }
          ],
          canvas: {
            cssW: window.innerWidth,
            cssH: window.innerHeight,
            backingW: Math.round(window.innerWidth * dpr),
            backingH: Math.round(window.innerHeight * dpr),
            dpr: dpr
          },
          match: {
            round: 1,
            phase: "placing",
            timeLeft: 5.0,
            playableRect: { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight },
            players: [],
            events: []
          }
        };

        window.__hitmeUiDump = function() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const safeTop = (h > 800) ? 44 : 20;
          return [
            { name: "BtnQuickMatch", text: "CHƠI NHANH", spriteName: "ui_btn_cta_yellow", rect: { x: (w - 280) / 2, y: h - 230, w: 280, h: 52 }, interactable: true, visible: true },
            { name: "BtnPractice", text: "LUYỆN VỚI BOT", spriteName: "btn_navy_normal", rect: { x: (w - 280) / 2, y: h - 160, w: 280, h: 48 }, interactable: true, visible: true },
            { name: "BtnSettings", text: "⚙", spriteName: "ui_btn_circle_back", rect: { x: w - 54, y: safeTop + 10, w: 44, h: 44 }, interactable: true, visible: true }
          ];
        };
      } else {
        try {
          delete window.__hitmeState;
          delete window.__hitmeUiDump;
        } catch(e) {}
      }

      const script = document.createElement("script"); script.src = versioned(buildUrl + "/{{{ LOADER_FILENAME }}}");
      script.onload = () => createUnityInstance(canvas, config, () => {}).then(instance => { loading.remove(); canvas.focus(); }).catch(error => unityShowBanner(error, "error"));
      document.body.appendChild(script);
    </script>
  </body>
</html>
