<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT ME — Game Dân Gian Làng Quê</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #060709;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        max-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-fullscreen-container {
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        aspect-ratio: 9 / 19.5;
        width: auto;
        max-width: 100vw;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        outline: none;
        display: block;
        touch-action: none;
      }
      #unity-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #080a0f;
        color: #ffe882;
        font-size: 20px;
        font-weight: bold;
        z-index: 10;
        letter-spacing: 0.5px;
      }
      #unity-warning {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        color: #111;
      }
      #rotate-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #060709;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
      }
      @media screen and (orientation: landscape) and (max-height: 600px) {
        #rotate-notice { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
    </div>
    <div id="unity-loading">Đang tải HIT ME…</div>
    <div id="unity-warning"></div>

    <div id="rotate-notice">
      <div style="font-size: 56px; margin-bottom: 16px;">🔄</div>
      <div style="font-size: 22px; font-weight: bold; color: #f8b920; margin-bottom: 8px;">VUI LÒNG XOAY DỌC MÀN HÌNH</div>
      <div style="font-size: 15px; color: #fff8dc; line-height: 1.4;">Trò chơi được thiết kế tối ưu cho trải nghiệm màn hình dọc điện thoại</div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      function unityShowBanner(message, type) {
        const banner = document.querySelector("#unity-warning");
        const item = document.createElement("div"); item.textContent = message;
        item.style.cssText = `padding:8px;background:${type === "error" ? "#d33" : "#fc3"}`;
        banner.appendChild(item); if (type !== "error") setTimeout(() => item.remove(), 5000);
      }
      ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(type => canvas.addEventListener(type, event => event.preventDefault(), { passive: false }));
      document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
      const buildUrl = "Build";
      const buildVersion = new URLSearchParams(window.location.search).get("v") || "phase1-closed-20261028";
      const versioned = path => path + "?v=" + encodeURIComponent(buildVersion);
      const config = {
        arguments: [], dataUrl: versioned(buildUrl + "/{{{ DATA_FILENAME }}}"), frameworkUrl: versioned(buildUrl + "/{{{ FRAMEWORK_FILENAME }}}"), codeUrl: versioned(buildUrl + "/{{{ CODE_FILENAME }}}"),
        streamingAssetsUrl: "StreamingAssets", companyName: "{{{ COMPANY_NAME }}}", productName: "{{{ PRODUCT_NAME }}}", productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner, matchWebGLToCanvasSize: true
      };
      const script = document.createElement("script"); script.src = versioned(buildUrl + "/{{{ LOADER_FILENAME }}}");
      script.onload = () => createUnityInstance(canvas, config, () => {}).then(instance => { loading.remove(); canvas.focus(); }).catch(error => unityShowBanner(error, "error"));
      document.body.appendChild(script);
    </script>
  </body>
</html>
