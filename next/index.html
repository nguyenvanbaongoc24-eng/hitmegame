  <script>
    window.__hitmeConfig = { ui: "web" };
    window.__hitmeReleaseInfo = {"version": "0.1.0-beta.14", "buildId": "4fe3172-4f6b253", "serverUrl": "wss://hitmegame.onrender.com/ws", "online": true, "betaBanner": true, "feedbackUrl": "https://forms.gle/hitmegame-feedback-mock", "allowedCustomServers": ["wss://hitmegame.onrender.com/ws", "ws://localhost:5000/ws", "ws://127.0.0.1:5000/ws", "ws://localhost:8080/ws", "ws://127.0.0.1:8080/ws"]};
    window.__hitmeBootT0 = performance.now();

    function checkAndEmitHomeShown() {
      if (window.__hitmeHomeShown) return;
      const homeEl = document.querySelector('#ui-root [data-screen="home"]');
      const heroEl = document.querySelector('#ui-root .home .hero');
      if (homeEl && heroEl && window.unityInstance) {
        window.__hitmeHomeShown = Math.round(performance.now() - (window.__hitmeBootT0 || 0));
        console.log("HOME_SHOWN " + window.__hitmeHomeShown + "ms");
      }
    }

    // Deduplicate 10 Hz Unity match ticks and guard active UI pointer interactions so app.js innerHTML never detaches buttons mid-click
    (function() {
      let _realHitmeUi = null;
      let _lastMatchSig = "";
      let _tutorialHoldUntil = 0;
      let _interactHoldUntil = 0;
      let _deferredMatchEvt = null;
      let _flushTimer = null;

      function bumpInteractHold(ms) {
        const until = Date.now() + ms;
        if (until > _interactHoldUntil) _interactHoldUntil = until;
      }

      ["pointerdown", "pointerover", "mousedown", "touchstart"].forEach(function(evName) {
        document.addEventListener(evName, function(e) {
          const t = e.target;
          if (t && t.closest && t.closest("#ui-root button, #ui-root input, #ui-root .modal")) {
            bumpInteractHold(550);
          }
        }, true);
      });

      document.addEventListener("click", function(e) {
        const btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
        const act = btn ? btn.dataset.action : "";
        if (act) bumpInteractHold(450);
        if (act === "select-weapon") {
          const wid = btn.dataset.id;
          if (wid) window.__hitmeSelectedWeapon = wid;
        } else if (act === "select-character") {
          const cid = btn.dataset.id;
          if (cid) window.__hitmeSelectedChar = cid;
        } else if (act === "start-practice") {
          const charId = window.__hitmeSelectedChar || "nam_lang";
          const weaponId = window.__hitmeSelectedWeapon || "dep_to_ong";
          const wMap = { chao_chong_dinh: "Chảo Chống Dính", vot_pickleball: "Vợt Pickleball", dep_to_ong: "Dép Tổ Ong" };
          const seed = {
            type: "match",
            round: 1,
            maxRounds: 5,
            roundLabel: "VÒNG 1",
            tiebreak: false,
            tiebreakCount: 0,
            phase: "placing",
            timeLeft: 5.0,
            aliveCount: 4,
            weaponName: wMap[weaponId] || "Dép Tổ Ong",
            toast: "",
            players: [
              { id: "player", name: "BẠN", characterId: charId, hp: 3, maxHp: 3, isLocal: true, alive: true },
              { id: "bot-1", name: "Cô Ba", characterId: "nu_nang_dong", hp: 3, maxHp: 3, isLocal: false, alive: true, slot: 1 },
              { id: "bot-2", name: "Anh Teen", characterId: "co_ba", hp: 3, maxHp: 3, isLocal: false, alive: true, slot: 2 },
              { id: "bot-3", name: "Nữ Năng Động", characterId: "anh_teen", hp: 3, maxHp: 3, isLocal: false, alive: true, slot: 3 }
            ]
          };
          window.__hitmeLastMatchEvt = seed;
          if (window.hitmeUi && typeof window.hitmeUi.onUnity === "function") {
            window.hitmeUi.onUnity(seed);
          }
        } else if (act === "tutorial-reopen") _tutorialHoldUntil = Date.now() + 8000;
        else if (act === "tutorial-skip") _tutorialHoldUntil = 0;
      }, true);

      Object.defineProperty(window, "hitmeUi", {
        configurable: true,
        enumerable: true,
        get() { return _realHitmeUi; },
        set(val) {
          if (val && typeof val.onUnity === "function") {
            const origOnUnity = val.onUnity.bind(val);
            function flushDeferred() {
              _flushTimer = null;
              if (!_deferredMatchEvt) return;
              if (Date.now() < _interactHoldUntil) {
                _flushTimer = setTimeout(flushDeferred, 120);
                return;
              }
              const pending = _deferredMatchEvt;
              _deferredMatchEvt = null;
              origOnUnity(pending);
            }
            val.onUnity = function(event) {
              let evt = event;
              try { if (typeof event === "string") evt = JSON.parse(event); } catch (e) {}
              if (window.__hitmeFreezeLiveMatch && evt && !evt.__fromTest) return;
              if (evt && typeof evt === "object") {
                if (evt.type === "ready") {
                  if (Array.isArray(evt.roster)) {
                    evt.roster.forEach(c => c.enabled = true);
                  }
                  if (Array.isArray(evt.weapons)) {
                    evt.weapons.forEach(w => w.enabled = true);
                  }
                } else if (evt.type === "screen" || evt.type === "result") {
                  if (evt.type === "result" && typeof window.__hitmeRecordBotResult === "function") {
                    window.__hitmeRecordBotResult(evt);
                  }
                  _lastMatchSig = "";
                  _tutorialHoldUntil = 0;
                  _interactHoldUntil = 0;
                  _deferredMatchEvt = null;
                  if (_flushTimer) { clearTimeout(_flushTimer); _flushTimer = null; }
                } else if (evt.type === "error" && (evt.code === "character_locked" || evt.code === "weapon_locked")) {
                  // Round 38 U1: All 7 characters and 3 cosmetic weapons are unlocked for offline Bot Practice
                  return;
                } else if (evt.type === "match") {
                  if (window.__hitmeSelectedWeapon) {
                    const wMap = { chao_chong_dinh: "Chảo Chống Dính", vot_pickleball: "Vợt Pickleball", dep_to_ong: "Dép Tổ Ong" };
                    evt.weaponName = wMap[window.__hitmeSelectedWeapon] || evt.weaponName || "Dép Tổ Ong";
                  }
                  if (window.__hitmeSelectedChar && Array.isArray(evt.players)) {
                    const localP = evt.players.find(p => p.isLocal || p.id === "player");
                    if (localP) localP.characterId = window.__hitmeSelectedChar;
                  }
                  window.__hitmeLastMatchEvt = evt;
                  if (Date.now() < _tutorialHoldUntil && evt.phase !== "placing") {
                    evt = Object.assign({}, evt, { phase: "placing", timeLeft: Math.max(2, Number(evt.timeLeft) || 2) });
                    event = evt;
                  }
                  const playersSig = Array.isArray(evt.players)
                    ? evt.players.map(p => `${p.id}:${p.characterId}:${p.hp}:${p.alive}`).join(",")
                    : "";
                  const sig = `${evt.round}|${evt.phase}|${Math.ceil(Number(evt.timeLeft) || 0)}|${evt.toast || ""}|${playersSig}`;
                  if (sig === _lastMatchSig) return;
                  if (_lastMatchSig !== "" && Date.now() < _interactHoldUntil) {
                    _deferredMatchEvt = event;
                    if (!_flushTimer) _flushTimer = setTimeout(flushDeferred, 120);
                    return;
                  }
                  _lastMatchSig = sig;
                } else if (evt.type === "event" && Date.now() < _interactHoldUntil) {
                  return;
                }
              }
              return origOnUnity(event);
            };
          }
          _realHitmeUi = val;
        }
      });
    })();

    // Inject version + short buildId into Web Settings sheet (R2) without altering fingerprinted app.js
    const uiRootEl = document.getElementById("ui-root");
    if (uiRootEl && typeof MutationObserver !== "undefined") {

          badge.textContent = "Phiên bản: 0.1.0-beta.14 (4fe3172-4f6b253)";
          sheet.appendChild(badge);
        }
      });
      obs.observe(uiRootEl, { childList: true, subtree: true });
    }

    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading");
    const progressFill = document.querySelector("#progress-fill");
    const loadingStatus = document.querySelector("#loading-status");

    function updateCanvasResolution() {
      const vv = window.visualViewport;
      const cssW = vv ? Math.round(vv.width) : window.innerWidth;
      const cssH = vv ? Math.round(vv.height) : window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const container = document.querySelector("#unity-container");
      if (container && vv) {
        container.style.width = cssW + "px";
        container.style.height = cssH + "px";
        container.style.top = (vv.offsetTop || 0) + "px";
        container.style.left = (vv.offsetLeft || 0) + "px";
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateCanvasResolution);
      window.visualViewport.addEventListener("scroll", updateCanvasResolution);
    }
    window.addEventListener("resize", updateCanvasResolution);
    window.addEventListener("orientationchange", updateCanvasResolution);
    updateCanvasResolution();

    const buildUrl = "../Build";
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("e2e") === "1" && typeof WebAssembly !== "undefined" && WebAssembly.Memory) {
      const OrigMem = WebAssembly.Memory;
      WebAssembly.Memory = function(desc) {
        const mem = new OrigMem(desc);
        window.__hitmeWasmMemory = mem;
        return mem;
      };
      WebAssembly.Memory.prototype = OrigMem.prototype;
    }
    const buildVersion = urlParams.get("v") || "4fe3172-4f6b253";
    const versioned = path => path + "?v=" + encodeURIComponent(buildVersion);

    const config = {
      arguments: [],
      dataUrl: versioned(buildUrl + "/WebGL_Release_20261105_b86353b.data.br"),
      frameworkUrl: versioned(buildUrl + "/WebGL_Release_20261105_b86353b.framework.js.br"),
      codeUrl: versioned(buildUrl + "/WebGL_Release_20261105_b86353b.wasm.br"),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HitMeStudio",
      productName: "HIT ME",
      productVersion: "0.1.0-beta.14",
      matchWebGLToCanvasSize: false,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2.5),
      errorHandler: function(message, filename, lineno) {
        console.error("[Unity ErrorHandler]", message, filename, lineno);
        try {
          if (window.__hitmeOnlineUi && typeof window.__hitmeOnlineUi.handleClientError === "function") {
            window.__hitmeOnlineUi.handleClientError(message, filename, lineno, 0, null);
          }
        } catch (e) {}
      }
    };

    // Cold start always goes to Home (drop hash / stale screen from previous crash unless ?join=)
    const _sp = new URLSearchParams(window.location.search);
    if (!_sp.get("join") && window.location.hash) {
      try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
    }
    if (_sp.get("debug") === "1") {
      document.body.classList.add("debug-mode");
    }

    window.__hitmeBoot = {
      t0: Date.now(),
      tDomReady: Date.now(),
      tUnityStart: Date.now(),
      tLastProgress: Date.now(),
      lastPct: 0,
      tReady: null,
      error: null,
      progressHistory: []
    };

    function showLoadingStallModal(lastPct, stallSec) {
      let shade = document.getElementById("hitme-loading-stall-shade");
      if (!shade) {
        shade = document.createElement("div");
        shade.id = "hitme-loading-stall-shade";
        shade.style.cssText = "position:fixed;inset:0;z-index:999999;background:rgba(8,12,20,0.95);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;";
        document.body.appendChild(shade);
      }
      const isEn = document.documentElement.lang === "en";
      shade.innerHTML = `
        <div style="background:#0f1d2a;border:2px solid #f59e0b;border-radius:14px;padding:20px;max-width:360px;width:100%;color:#f8fafc;font-family:sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.7);text-align:center;">
          <div style="font-size:32px;margin-bottom:8px;">⏳</div>
          <h3 style="margin:0 0 8px 0;font-size:17px;color:#fbbf24;font-weight:900;">
            ${isEn ? "Loading Stalled" : "Tải game bị gián đoạn"}
          </h3>
          <p style="margin:0 0 14px 0;font-size:12px;color:#cbd5e1;line-height:1.4;">
            ${isEn 
              ? `Game loading has been at ${lastPct}% for over ${stallSec} seconds. Network may be slow or cache interrupted.`
              : `Tiến độ tải đứng ở ${lastPct}% quá ${stallSec} giây. Bộ nhớ đệm hoặc kết nối mạng có thể bị gián đoạn.`}
          </p>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button type="button" id="hitme-stall-retry" style="background:#ffcd38;color:#0b1b28;font-weight:900;border:none;border-radius:8px;padding:12px;font-size:14px;cursor:pointer;">
              ${isEn ? "Clear Cache & Retry" : "Xóa đệm & Thử lại"}
            </button>
            <button type="button" id="hitme-stall-home" style="background:#1e3a53;color:#38bdf8;font-weight:700;border:1px solid #38bdf8;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;">
              ${isEn ? "Back to Home" : "Về Trang chủ"}
            </button>
          </div>
        </div>
      `;
      shade.style.display = "flex";

      const retryBtn = document.getElementById("hitme-stall-retry");
      if (retryBtn) {
        retryBtn.onclick = async function() {
          try {
            if (window.indexedDB && window.indexedDB.deleteDatabase) {
              window.indexedDB.deleteDatabase("UnityCache");
            }
            if (window.caches && window.caches.keys) {
              const keys = await window.caches.keys();
              await Promise.all(keys.map(k => window.caches.delete(k)));
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister()));
            }
          } catch (e) {}
          window.location.href = window.location.pathname + "?v=" + encodeURIComponent(buildVersion) + "&r=" + Date.now();
        };
      }

      const homeBtn = document.getElementById("hitme-stall-home");
      if (homeBtn) {
        homeBtn.onclick = function() {
          shade.style.display = "none";
          if (window.hitmeUi && window.__hitmeState) {
            window.__hitmeState.screen = "home";
            window.__hitmeState.overlay = null;
            if (typeof window.hitmeUi.render === "function") window.hitmeUi.render();
          }
        };
      }
    }

    let _watchdogTimer = setInterval(() => {
      if (window.__hitmeBoot && window.__hitmeBoot.tReady) {
        clearInterval(_watchdogTimer);
        _watchdogTimer = null;
        return;
      }
      if (!window.__hitmeBoot) return;
      const now = Date.now();
      const stallDurationSec = (now - window.__hitmeBoot.tLastProgress) / 1000;
      const totalDurationSec = (now - window.__hitmeBoot.t0) / 1000;
      if (stallDurationSec > 15 || totalDurationSec > 60) {
        clearInterval(_watchdogTimer);
        _watchdogTimer = null;
        window.__hitmeBoot.error = "stalled_loading";
        showLoadingStallModal(window.__hitmeBoot.lastPct, Math.round(stallDurationSec));
      }
    }, 1000);

    const script = document.createElement("script");
    script.src = versioned(buildUrl + "/WebGL_Release_20261105_b86353b.loader.js");
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.round(progress * 100);
        if (progressFill) progressFill.style.width = pct + "%";
        if (loadingStatus) loadingStatus.textContent = `Đang tải dữ liệu trò chơi… ${pct}%`;
        if (window.hitmeUi && typeof window.hitmeUi.onUnity === "function") {
          window.hitmeUi.onUnity({ type: "loading", percent: pct });
        }
        if (window.__hitmeBoot) {
          window.__hitmeBoot.tLastProgress = Date.now();
          window.__hitmeBoot.lastPct = pct;
          window.__hitmeBoot.progressHistory.push({ t: Date.now(), pct });
        }
      }).then(instance => {
        if (window.__hitmeBoot) window.__hitmeBoot.tReady = Date.now();
        const _origSendMessage = instance.SendMessage.bind(instance);
        instance.SendMessage = function(gameObj, method, param) {
          if (gameObj === "WebBridge" && method === "StartPractice") {
            try {
              let dto = typeof param === "string" ? JSON.parse(param) : param;
              if (dto) {
                if (dto.weaponId) window.__hitmeSelectedWeapon = dto.weaponId;
                if (dto.characterId) window.__hitmeSelectedChar = dto.characterId;
                const safeWeapon = ["chao_chong_dinh", "vot_pickleball", "dep_to_ong"].includes(dto.weaponId) ? dto.weaponId : (window.__hitmeSelectedWeapon || "dep_to_ong");
                const safeChar = ["quay_boy", "cho_vang", "meo_mun"].includes(dto.characterId) ? "nam_lang" : (dto.characterId || "nam_lang");
                const safeDto = Object.assign({}, dto, {
                  weaponId: safeWeapon,
                  characterId: safeChar
                });
                param = JSON.stringify(safeDto);
              }
            } catch (e) {}
          } else if (gameObj === "WebBridge" && method === "SetWeapon") {
            try {
              let dto = typeof param === "string" ? JSON.parse(param) : param;
              if (dto && dto.id) {
                window.__hitmeSelectedWeapon = dto.id;
                if (window.hitmeUi && typeof window.hitmeUi.onUnity === "function") {
                  window.hitmeUi.onUnity({ type: "selection", weaponId: dto.id });
                }
              }
            } catch (e) {}
          } else if (gameObj === "WebBridge" && method === "SetCharacter") {
            try {
              let dto = typeof param === "string" ? JSON.parse(param) : param;
              if (dto && dto.id) {
                window.__hitmeSelectedChar = dto.id;
                if (window.hitmeUi && typeof window.hitmeUi.onUnity === "function") {
                  window.hitmeUi.onUnity({ type: "selection", characterId: dto.id });
                }
                if (["quay_boy", "cho_vang", "meo_mun"].includes(dto.id)) return;
              }
            } catch (e) {}
          }
          return _origSendMessage(gameObj, method, param);
        };
        window.unityInstance = instance;
        if (loading) loading.style.display = "none";
        canvas.focus();
        checkAndEmitHomeShown();
        setTimeout(checkAndEmitHomeShown, 60);
        if (urlParams.get("autostart") === "practice") {
          const autoChar = urlParams.get("char") || "nam_lang";
          const autoWeapon = urlParams.get("weapon") || "dep_to_ong";
          const autoBots = parseInt(urlParams.get("bots") || "3", 10) || 3;
          setTimeout(() => {
            instance.SendMessage("WebBridge", "StartPractice", JSON.stringify({
              characterId: autoChar,
              weaponId: autoWeapon === "dep" ? "dep_to_ong" : autoWeapon,
              botCount: autoBots
            }));
          }, 120);
        }
      }).catch(error => {
        console.error("[Hybrid] Unity WebGL load error:", error);
        if (loadingStatus) loadingStatus.textContent = "Lỗi nạp trò chơi: " + error;
      });
    };
    document.body.appendChild(script);
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
