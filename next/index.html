    /* B-2..B-5: Village Courtyard Home Background (u4_background.png) + Single Baked Lotus Pedestal */

      background-image: -webkit-image-set(

        url('./assets/bg_home_1170.webp') 2x,

      content: "" !important;
      position: absolute !important;

    /* Remove duplicate CSS-drawn lotus pedestal and bottom arena strip */
    .home .pedestal,
    .home .pedestal:before,
    .home .home-bottom-art {
      display: none !important;
    }
    /* Ground character feet onto the baked stone lotus pedestal at (fx=0.5, fy=0.4844) */
    .home .hero {
      top: calc(var(--pedestal-feet-y, 48.44%) - var(--hero-stand-h, 28%)) !important;
      height: var(--hero-stand-h, 28%) !important;

      object-position: center bottom !important;

    /* Clean framing for character head avatars and weapon icons */
    .home .avatar {
      background: radial-gradient(circle at 50% 42%, #1e3a5f 0%, #0d1b2a 100%) !important;

    .home .avatar img {

      height: 100% !important;

      object-position: center center !important;

    .selection-card img,

      .home .selection-card { top: 53.5% !important; height: 8.2% !important; min-height: 44px !important; }

      .home .practice { top: 82.2% !important; height: 7.4% !important; min-height: 44px !important; }

    /* ============================================================================
       ROUND 38 G1–G8: In-Match HUD, Timer Ring + 5 Dots, Non-Blocking Interactive
       Tutorial, Phase Banners, Bot Setup Top Selector & Scroll, and Home Polish
       ============================================================================ */

    /* G7a: Hide stray server-dot circle O after 'Sắp ra mắt' on CHƠI NHANH */
    .home .quick .server-dot {
      display: none !important;
    }

    .live-card img {
      width: 22px !important;

      padding: 1px !important;
      object-fit: contain !important;

    }
    .live-card.local img {

    .live-cards[data-count="5"] .live-card img,
    .live-cards[data-count="6"] .live-card img {

    .live-card div {

      justify-content: center !important;

    .live-card b {
      display: block !important;

      font-weight: 800 !important;
      line-height: 1.1 !important;
      padding: 0 1px !important;
      background: transparent !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95) !important;
      color: #fff8e8 !important;

      text-overflow: ellipsis !important;
      white-space: nowrap !important;

      max-width: 100% !important;
    }
    .live-cards[data-count="5"] .live-card b,
    .live-cards[data-count="6"] .live-card b {
      font-size: 8px !important;
      display: block !important;
    }
    .live-card.hold-reveal b {
      display: block !important;
      position: absolute !important;
      top: -24px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      background: #0b1421f5 !important;
      border: 1px solid #ffcd38 !important;
      border-radius: 6px !important;
      padding: 2px 6px !important;
      z-index: 10 !important;
      white-space: nowrap !important;
      max-width: none !important;
    }
      font-size: 11px !important;
      z-index: 30 !important;
      white-space: nowrap !important;
    }
    .live-hearts {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;

    /* G2 / SECTION A: Center-Top Countdown Progress Ring + 5 Round Dots */
    .live-summary {
      display: grid !important;
      grid-template-columns: 1fr auto 1fr !important;
      align-items: center !important;
      gap: 6px !important;
      min-height: 34px !important;
      height: 34px !important;
      margin-bottom: 2px !important;
    }
    .r38-round-cluster {
      display: flex !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 2px !important;
    }
    .r38-round-cluster b {
      font-size: 11px !important;
      font-weight: 900 !important;
      color: #ffe258 !important;
      letter-spacing: 0.03em !important;
      line-height: 1.1 !important;
    }
    .r38-round-dots {
      display: flex !important;
      align-items: center !important;
      gap: 3px !important;
    }
    .r38-round-dot {
      width: 6px !important;
      height: 6px !important;
      border-radius: 50% !important;
      border: 1px solid #ffd84d !important;
      background: rgba(15, 23, 42, 0.75) !important;
      transition: transform 0.2s ease, background 0.2s ease !important;
    }
    .r38-round-dot.past {
      background: #17b987 !important;
      border-color: #34d399 !important;
    }
    .r38-round-dot.current {
      background: #ffcd38 !important;
      border-color: #fff8e8 !important;
      transform: scale(1.22) !important;
      box-shadow: 0 0 5px rgba(255, 205, 56, 0.85) !important;
    }
    .r38-timer-ring {
      position: relative !important;
      width: 42px !important;
      height: 42px !important;
      border-radius: 50% !important;
      display: grid !important;
      place-items: center !important;
      background: conic-gradient(var(--timer-color, #19d5d8) var(--timer-pct, 100%), rgba(255, 255, 255, 0.14) 0) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55) !important;

    }
    .r38-timer-ring::before {
      content: "" !important;
      position: absolute !important;
      inset: 2.5px !important;
      border-radius: 50% !important;
      background: radial-gradient(circle at 50% 35%, #192b42 0%, #0b1421 100%) !important;
    }
    .r38-timer-ring.coin-style::before {
      background: radial-gradient(circle at 35% 30%, #ffe66d 0%, #d98212 85%, #7c3f06 100%) !important;
    }
    .r38-timer-ring span {
      position: relative !important;
      z-index: 2 !important;
      font-size: 16px !important;
      font-weight: 900 !important;
      color: #fff8e8 !important;
      line-height: 1 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8) !important;
    }
    .r38-timer-ring.urgent {
      --timer-color: #f66a5d !important;
      animation: r38-timer-pulse 0.48s ease-in-out infinite !important;
    }
    .r38-timer-ring.urgent span {
      color: #ffdf55 !important;
    }

      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); box-shadow: 0 0 12px rgba(246, 106, 93, 0.85); }
    }
    .live-summary > button[data-action="settings"],
    .r43-match-settings-btn {
      justify-self: end !important;
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      min-height: 44px !important;
      font-size: 0 !important;
      display: grid !important;
      place-items: center !important;
      padding: 0 !important;
      border-radius: 50% !important;
      background: rgba(13, 27, 43, 0.90) !important;
      border: 1.5px solid #ffcd38 !important;
      color: #fff8e8 !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
    }
    .live-summary > button[data-action="settings"]::before,
    .live-summary > button[data-action="settings"]::after,
    .r43-match-settings-btn::before,
    .r43-match-settings-btn::after {
      content: none !important;
      display: none !important;
    }
    .live-summary > button[data-action="settings"] svg,
    .r43-match-settings-btn svg {
      width: 22px !important;
      height: 22px !important;
      display: block !important;
      margin: auto !important;
      color: #fff8e8 !important;
      stroke: currentColor !important;
    }

    /* M2: Seamless letterbox fill at bottom of court - zero hard contrast seams */
    .live-match::before {
      content: "" !important;
      position: absolute !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      height: 220px !important;
      background-image: url('./assets/bg_home_1170.webp') !important;
      background-position: center 95% !important;
      background-size: cover !important;
      filter: blur(8px) brightness(0.65) !important;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 25%, black 100%) !important;
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 25%, black 100%) !important;
      pointer-events: none !important;
      z-index: 1 !important;
    }
    .live-match::after {
      content: "" !important;
      position: absolute !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      height: 120px !important;
      background: linear-gradient(180deg, rgba(8, 16, 26, 0) 0%, rgba(6, 12, 22, 0.75) 60%, #060c16 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }

    /* SECTION A: Floating Phase Capsule (never adds permanent height to HUD) */
    .live-phase {
      position: absolute !important;
      top: calc(100% + 6px) !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      background: rgba(11, 20, 33, 0.90) !important;
      border: 1.5px solid rgba(255, 205, 56, 0.75) !important;
      border-radius: 999px !important;
      padding: 3px 12px !important;
      font-size: 11px !important;
      font-weight: 900 !important;
      color: #ffe258 !important;
      letter-spacing: 0.04em !important;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5) !important;
      pointer-events: none !important;
      white-space: nowrap !important;
      z-index: 20 !important;
    }

    /* SECTION A: Compact Bottom Bar (<= 12% budget) */
    .live-bottom {
      min-height: 0 !important;
      height: auto !important;
      padding: 4px 12px max(8px, env(safe-area-inset-bottom, 8px)) !important;
      background: linear-gradient(0deg, rgba(6, 12, 22, 0.95) 0%, rgba(6, 12, 22, 0.75) 85%, transparent 100%) !important;
      display: flex !important;
      flex-direction: column !important;

    }
    .live-progress {
      padding: 0 !important;
      margin: 0 !important;
      min-height: 0 !important;
    }
    .live-progress b {
      font-size: 11px !important;
      color: #94a3b8 !important;
    }
    .live-controls {
      height: 42px !important;
      gap: 6px !important;
    }
    .live-weapon-chip {
      height: 38px !important;
      padding: 0 10px !important;
      font-size: 12px !important;
    }
    .live-ready {
      height: 38px !important;
      font-size: 13px !important;
      padding: 0 14px !important;
    }
    .live-emote-trigger {
      width: 38px !important;
      height: 38px !important;
      font-size: 18px !important;
    }

    /* G3: Non-Blocking Interactive Tutorial (never covers the center court; pointer-events pass through) */
    .live-tutorial {
      left: 4% !important;
      right: 4% !important;
      bottom: calc(var(--live-bottom, 118px) + 6px) !important;
      padding: 8px 12px !important;

    }
    .live-tutorial p {

    .live-tutorial button {

      padding: 6px 10px !important;
      font-size: 12px !important;
    }
    .r38-hand-guide {
      position: fixed !important;
      left: 50% !important;
      top: 56% !important;
      width: 42px !important;
      height: 42px !important;
      margin-left: -21px !important;
      margin-top: -21px !important;
      z-index: 22 !important;
      pointer-events: none !important;

      animation: r38-hand-drag 1.6s ease-in-out infinite !important;

    @keyframes r38-hand-tap {

    }

    /* G4: Phase Transition Banner (0.6s bounce-in + fade-out, non-blocking) */
    #r38-phase-banner {
      position: fixed !important;
      left: 50% !important;
      top: 38% !important;
      transform: translate(-50%, -50%) scale(0.7) !important;
      z-index: 45 !important;
      padding: 10px 26px !important;
      border-radius: 999px !important;
      background: linear-gradient(180deg, #ffdf4a 0%, #f59e0b 100%) !important;
      border: 3px solid #fff8e8 !important;
      color: #2b1206 !important;

      // Safe execution helper: DOM enhancers must NEVER throw or block game flow
      function safeRun(name, fn) {
        try {
          return fn();

          console.warn("[safeRun:" + name + "]", err);
          try {
            if (window.__hitmeDiagnostics) {
              if (!Array.isArray(window.__hitmeDiagnostics.errors)) window.__hitmeDiagnostics.errors = [];
              window.__hitmeDiagnostics.errors.push({
                name: name,
                message: String(err && err.message || err),
                stack: String(err && err.stack || ""),
                time: Date.now()
              });
            }
          } catch (e) {}
          return null;
        }
      }
      window.safeRun = safeRun;

      // Round 38 G1–G8 DOM Enhancer (Timer Ring + 5 Round Dots + Phase Banners + Hold-to-View Name + Interactive Hand Guide)
      let _r38LastPhase = "";

      const R38_PROFILE_KEY = "hitme_local_profile_v1";
      let _r38MemProfile = null;
      function getTodayLocalStr() {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function loadLocalProfile() {
        const today = getTodayLocalStr();
        let data = _r38MemProfile;
        if (!data) {
          try {
            const raw = localStorage.getItem(R38_PROFILE_KEY);
            if (raw) data = JSON.parse(raw);
          } catch (e) {}
        }
        if (!data || typeof data !== "object" || Number(data.schemaVersion) < 1) {
          data = {
            schemaVersion: 1,
            questRewardsEnabled: false,
            lastResetDate: today,
            botMatchesPlayed: 0,
            botMatchesWon: 0,
            totalHitsLanded: 0,
            maxRoundSurvived: 0,
            experimentalGoldClaimed: 0,
            quests: {
              play_1_match: { progress: 0, target: 1, reward: 50, claimed: false, title: "Chơi 1 trận luyện bot" },
              land_3_hits: { progress: 0, target: 3, reward: 60, claimed: false, title: "Ném trúng 3 lần" },
              survive_round_3: { progress: 0, target: 3, reward: 70, claimed: false, title: "Sống tới vòng 3" },
              win_1_match: { progress: 0, target: 1, reward: 100, claimed: false, title: "Thắng 1 trận luyện bot" }
            }
          };
        }
        if (data.lastResetDate !== today) {
          data.lastResetDate = today;
          Object.values(data.quests || {}).forEach(q => { q.progress = 0; q.claimed = false; });
        }
        _r38MemProfile = data;
        saveLocalProfile(data);
        return data;
      }
      function saveLocalProfile(data) {
        _r38MemProfile = data;
        try { localStorage.setItem(R38_PROFILE_KEY, JSON.stringify(data)); } catch (e) {}
      }
      function recordBotMatchResult(evt) {
        if (!evt || !Array.isArray(evt.rankings)) return;
        const p = loadLocalProfile();
        const me = evt.rankings.find(r => r.id === "player" || r.id === "you") || evt.rankings[0] || {};
        const won = Number(me.rank) === 1;
        const hits = Math.max(0, Number(me.hits) || 0);
        const rounds = Math.max(1, Number(me.roundSurvived || evt.round) || 1);
        p.botMatchesPlayed = (Number(p.botMatchesPlayed) || 0) + 1;
        if (won) p.botMatchesWon = (Number(p.botMatchesWon) || 0) + 1;
        p.totalHitsLanded = (Number(p.totalHitsLanded) || 0) + hits;
        p.maxRoundSurvived = Math.max(Number(p.maxRoundSurvived) || 0, rounds);
        if (p.quests) {
          if (p.quests.play_1_match) p.quests.play_1_match.progress = Math.min(1, (p.quests.play_1_match.progress || 0) + 1);
          if (p.quests.land_3_hits) p.quests.land_3_hits.progress = Math.min(3, (p.quests.land_3_hits.progress || 0) + hits);
          if (p.quests.survive_round_3) p.quests.survive_round_3.progress = Math.min(3, Math.max(p.quests.survive_round_3.progress || 0, rounds));
          if (p.quests.win_1_match && won) p.quests.win_1_match.progress = Math.min(1, (p.quests.win_1_match.progress || 0) + 1);
        }
        saveLocalProfile(p);
      }

      document.addEventListener("click", (e) => {
        const btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
        if (!btn) return;
        const act = btn.dataset.action || "";

          setTimeout(() => {
            const hero = document.querySelector("#ui-root .home .hero");

          if ((isOnlineEnabled || sp.get("online") === "1" || sp.get("lab") === "1" || sp.get("server")) && window.__hitmeOnlineUi) {
            const btnTxt = (btn.textContent || "").toUpperCase();

      let _r38WakeTimer = null;
      let _r38WakeSec = 0;
      function openOnlineStatusSheet(startWaking) {
        let shade = document.getElementById("r38-online-sheet-shade");
        if (!shade) {
          shade = document.createElement("div");
          shade.id = "r38-online-sheet-shade";
          shade.innerHTML = `
            <div class="r38-online-sheet" role="dialog" aria-modal="true" aria-label="Trạng thái máy chủ">

              <p id="r38-online-desc">Máy chủ đấu phòng trực tuyến hiện chưa mở kết nối WSS/CORS cho bản thử nghiệm này. Bạn có thể vào ngay chế độ <b>Luyện với Bot</b> (đã mở khóa đủ 7 nhân vật và 3 vũ khí)!</p>
              <div class="r38-waking-bar" id="r38-waking-bar" style="display:none"><i id="r38-waking-fill"></i></div>
              <div class="r38-online-actions">
                <button type="button" class="r38-online-btn-primary" id="r38-btn-go-bot">CHUYỂN SANG LUYỆN VỚI BOT</button>
                <button type="button" class="r38-online-btn-secondary" id="r38-btn-wake-retry">ĐÁNH THỨC MÁY CHỦ (TỚI 60 GIÂY)</button>
                <button type="button" class="r38-online-btn-secondary" id="r38-btn-online-close">ĐÓNG</button>
              </div>
            </div>
          `;
          document.body.appendChild(shade);
          shade.querySelector("#r38-btn-online-close").addEventListener("click", () => {
            if (_r38WakeTimer) { clearInterval(_r38WakeTimer); _r38WakeTimer = null; }
            shade.classList.remove("active");
          });
          shade.querySelector("#r38-btn-go-bot").addEventListener("click", () => {
            if (_r38WakeTimer) { clearInterval(_r38WakeTimer); _r38WakeTimer = null; }
            shade.classList.remove("active");
            const pracBtn = document.querySelector('#ui-root [data-action="practice"]');
            if (pracBtn) pracBtn.click();
          });
          shade.querySelector("#r38-btn-wake-retry").addEventListener("click", () => {
            startWakingSequence();
          });
        }
        shade.classList.add("active");
        if (startWaking) startWakingSequence();
      }

      function startWakingSequence() {
        const titleEl = document.getElementById("r38-online-title");
        const descEl = document.getElementById("r38-online-desc");
        const barEl = document.getElementById("r38-waking-bar");
        const fillEl = document.getElementById("r38-waking-fill");
        const retryBtn = document.getElementById("r38-btn-wake-retry");
        if (!titleEl || !descEl || !barEl || !fillEl) return;
        if (_r38WakeTimer) clearInterval(_r38WakeTimer);
        _r38WakeSec = 0;
        barEl.style.display = "block";
        titleEl.textContent = "ĐANG ĐÁNH THỨC MÁY CHỦ…";
        descEl.textContent = "Đang đánh thức máy chủ… (0/60 giây). Nếu quá hạn hoặc máy chủ đang bảo trì, hãy chuyển sang Luyện với Bot.";
        if (retryBtn) retryBtn.textContent = "THỬ LẠI KẾT NỐI";
        fillEl.style.width = "8%";
        _r38WakeTimer = setInterval(() => {
          _r38WakeSec += 1;
          const pct = Math.min(100, Math.round((_r38WakeSec / 60) * 100));
          fillEl.style.width = Math.max(8, pct) + "%";
          if (_r38WakeSec >= 60) {
            clearInterval(_r38WakeTimer);
            _r38WakeTimer = null;
            titleEl.textContent = "MÁY CHỦ CHƯA PHẢN HỒI";
            descEl.textContent = "Quá 60 giây chờ đánh thức hoặc CORS/WSS chưa bật. Gợi ý: Chuyển sang Luyện với Bot ngay!";
          } else {
            descEl.textContent = `Đang đánh thức máy chủ… (${_r38WakeSec}/60 giây). Bạn có thể chuyển sang Luyện với Bot bất cứ lúc nào.`;
          }
        }, 1000);
      }
      window.__hitmeOpenOnlineSheet = openOnlineStatusSheet;

      // 3-tap top-right corner FPS + Frame ms + Build ID overlay (or ?fps=1)
      let _r38TopLeftTaps = [];
      let _r38FpsVisible = (new URLSearchParams(location.search).get("fps") === "1") || (localStorage.getItem("hitme.showFps") === "1");
      let _r38FpsFrames = 0;
      let _r38FpsLastT = performance.now();
      function ensureFpsOverlay() {
        let el = document.getElementById("r38-fps-overlay");
        if (!el) {
          el = document.createElement("div");
          el.id = "r38-fps-overlay";
          el.style.cssText = "position:fixed;top:calc(env(safe-area-inset-top, 0px) + 6px);left:8px;right:auto;z-index:85;padding:3px 6px;border-radius:6px;background:rgba(6,14,24,0.85);border:1px solid #17b987;color:#6ee7b7;font:800 10.5px/1.25 monospace;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.5);display:none;";
          document.body.appendChild(el);
        }
        el.style.display = _r38FpsVisible ? "block" : "none";
        return el;
      }
      function tickFpsLoop(now) {
        _r38FpsFrames++;
        const dt = now - _r38FpsLastT;
        if (dt >= 500) {
          if (_r38FpsVisible) {
            const fps = Math.min(120, Math.round((_r38FpsFrames * 1000) / dt));
            const ms = (dt / Math.max(1, _r38FpsFrames)).toFixed(1);
            const ver = window.__hitmeReleaseInfo?.version || "0.1.0-beta.12";
            const bid = (window.__hitmeReleaseInfo?.buildId || "").slice(0, 7);
            const el = ensureFpsOverlay();
            el.innerHTML = `<div>${fps} fps · ${ms}ms</div><div style="opacity:0.75;font-size:9.5px;">${ver} (${bid})</div>`;
          }
          _r38FpsFrames = 0;
          _r38FpsLastT = now;
        }
        if (_r38FpsVisible) requestAnimationFrame(tickFpsLoop);
      }
      document.addEventListener("pointerdown", (ev) => {
        const vw = window.innerWidth || 390;
        const vh = window.innerHeight || 844;
        if (ev.clientX <= vw * 0.25 && ev.clientY <= vh * 0.15) {
          const now = performance.now();
          _r38TopLeftTaps = _r38TopLeftTaps.filter(t => now - t < 1400);
          _r38TopLeftTaps.push(now);
          if (_r38TopLeftTaps.length >= 3) {
            _r38TopLeftTaps = [];
            _r38FpsVisible = !_r38FpsVisible;
            try { localStorage.setItem("hitme.showFps", _r38FpsVisible ? "1" : "0"); } catch (e) {}
            const el = ensureFpsOverlay();
            if (_r38FpsVisible) {
              const ver = window.__hitmeReleaseInfo?.version || "0.1.0-beta.12";
              const bid = (window.__hitmeReleaseInfo?.buildId || "").slice(0, 7);
              el.innerHTML = `<div>60 fps · 16.7ms</div><div style="opacity:0.75;font-size:9.5px;">${ver} (${bid})</div>`;
              _r38FpsFrames = 0;
              _r38FpsLastT = performance.now();
              requestAnimationFrame(tickFpsLoop);
            }
          }
        }
      }, true);
      if (_r38FpsVisible) {
        document.addEventListener("DOMContentLoaded", () => {
          ensureFpsOverlay();
          requestAnimationFrame(tickFpsLoop);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const root = document.getElementById("ui-root");
        if (root && typeof MutationObserver !== "undefined") {
          const m = new MutationObserver(() => safeRun("enhanceRound38Dom", enhanceRound38Dom));
          m.observe(root, { childList: true, subtree: true });

        const uCanvas = document.getElementById("unity-canvas");

          uCanvas.addEventListener("pointerup", () => {

              const nextBtn = tut.querySelector('[data-action="tutorial-next"]');
              if (nextBtn) setTimeout(() => nextBtn.click(), 180);
            }
          });
        }
      });
    })();

      function computeCoRankings(playersList) {
        const list = (playersList || []).map((p, idx) => {
          const pid = p.playerId || p.id || ("p" + (idx + 1));
          const knownPlayer = (typeof onlineState === "object" && onlineState && Array.isArray(onlineState.players))
            ? onlineState.players.find(x => x.id === pid || x.name === pid)
            : null;
          let resolvedName = p.name || (knownPlayer && knownPlayer.name) || pid || ("Người chơi " + (idx + 1));
          if (resolvedName.length > 18 && resolvedName.startsWith("g_")) {
            resolvedName = "Khách " + resolvedName.slice(2, 8).toUpperCase();

          return {
            playerId: pid,
            name: resolvedName,
            alive: p.alive !== undefined ? !!p.alive : (!p.eliminated && Number(p.hp ?? 0) > 0),
            hp: Math.max(0, Number(p.hp ?? 0)),
            hitsLanded: Math.max(0, Number(p.hitsLanded ?? p.hits ?? 0)),
            throws: Math.max(0, Number(p.throws ?? 5)),
            goldReward: Math.max(0, Number(p.goldReward ?? 0)),
            rank: Number(p.rank || 0)
          };
        });
        list.sort((a, b) => {
          if (a.alive !== b.alive) return a.alive ? -1 : 1;
          if (b.hp !== a.hp) return b.hp - a.hp;
          return b.hitsLanded - a.hitsLanded;
        });
        let currentRank = 1;
        for (let i = 0; i < list.length; i++) {
          if (i > 0) {
            const prev = list[i - 1];
            const cur = list[i];
            if (prev.alive !== cur.alive || prev.hp !== cur.hp || prev.hitsLanded !== cur.hitsLanded) {

        }

        }
        let clean = raw.replace(/<[^>]*>/g, "");

        if (clean.length < 3) {
          return { ok: false, sanitized: clean, error: "Tên phải có ít nhất 3 ký tự." };
        }
        if (clean.length > 16) {
          clean = clean.slice(0, 16).trim();

        const lower = clean.toLowerCase();
        for (const w of VULGAR_WORDS) {
          const re = new RegExp("(^|\s|_|-)" + w + "($|\s|_|-)", "i");
          if (re.test(lower) || lower === w) {

                  ${isFreeRename ? "Đổi tên lần đầu miễn phí" : "Lần đổi: " + prof.renameCount}
                </span>
              </div>
              <div style="font-size:12px;color:#94a3b8;">
                Nhập tên hiển thị trong trận đấu (3–16 ký tự, tiếng Việt sạch):
              </div>
              <div class="r40-input-row">
                <input id="r40-name-input" type="text" maxlength="16" value="${currentName}" placeholder="Nhập tên của bạn...">
                <span id="r40-name-count" class="r40-input-count">${currentName.length}/16</span>
              </div>
              <div id="r40-name-err" style="color:#f87171;font-size:11.5px;font-weight:700;display:${err ? "block" : "none"};">${err || ""}</div>

              <div style="font-size:12px;color:#cbd5e1;font-weight:800;margin-top:4px;">CHỌN NHÂN VẬT MẶC ĐỊNH:</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow-y:auto;padding-right:2px;">
                ${CHARACTERS.map(c => `
                  <button type="button" class="r39-char-pick ${selectedChar === c.id ? "selected" : ""}" data-name-char="${c.id}" style="min-height:52px;flex:1 1 45%;">
                    <img src="${c.head}" alt="${c.name}" style="width:28px;height:28px;">
                    <span style="font-size:11px;">${c.name}${c.tam ? ' <span class="r40-tam-badge" style="background:#b45309;color:#fef08a;font-size:9.5px;padding:1px 4px;border-radius:4px;font-weight:800;">Thử nghiệm</span>' : ""}</span>
                  </button>
                `).join("")}
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
                <button type="button" class="r39-btn secondary" id="r40-name-cancel">HỦY / ĐÓNG</button>
                <button type="button" class="r39-btn" id="r40-name-save">LƯU HỒ SƠ</button>
              </div>
            </div>
          `;
          shade.style.display = "flex";

          const inputEl = shade.querySelector("#r40-name-input");
          const countEl = shade.querySelector("#r40-name-count");
          inputEl.addEventListener("input", () => {
            countEl.textContent = inputEl.value.length + "/16";
          });

          shade.querySelectorAll("[data-name-char]").forEach(btn => {
            btn.addEventListener("click", () => {
              selectedChar = btn.dataset.nameChar;
              renderModalContent();
            });
          });

          shade.querySelector("#r40-name-cancel").addEventListener("click", () => {
            shade.style.display = "none";
          });

          shade.querySelector("#r40-name-save").addEventListener("click", () => {
            const rawVal = inputEl.value;
            const res = validateAndSanitizeName(rawVal);
            if (!res.ok) {
              renderModalContent(res.error);
              return;
            }
            prof.name = res.sanitized;
            prof.characterId = selectedChar;
            prof.customized = true;
            if (prof.name !== currentName) {
              prof.renameCount = (prof.renameCount || 0) + 1;
              prof.token = "";
            }
            LocalProfileStore.saveProfile(prof);
            onlineState.playerName = prof.name;
            onlineState.characterId = prof.characterId;
            try { sessionStorage.setItem("hitme_online_name", prof.name); } catch (e) {}
            shade.style.display = "none";
            renderOnlineRoot();
            if (onSaved) onSaved(prof);
          });
        }

        renderModalContent();
      }

      function saveReconnectToken(tok) {
        if (!tok) return;
        onlineState.reconnectToken = tok;
        try { sessionStorage.setItem("hitme_reconnect_" + onlineState.playerName, tok); } catch (e) {}
      }

      function loadReconnectToken() {
        if (onlineState.reconnectToken) return onlineState.reconnectToken;
        try { return sessionStorage.getItem("hitme_reconnect_" + onlineState.playerName) || ""; } catch (e) { return ""; }
      }

      // In-memory Loopback Hub for ?lab=1 (supports 2 players on 1 machine + all fault scenarios)
      const loopbackHub = {
        peers: [
          { id: "NamLang", name: "Nam Làng (Bạn)", ready: false, characterId: "nam_lang", weaponId: "dep_to_ong", hp: 3, hitsLanded: 0, alive: true },
          { id: "CoBa_Peer", name: "Cô Ba (Máy 2)", ready: true, characterId: "co_ba", weaponId: "chao_chong_dinh", hp: 3, hitsLanded: 0, alive: true }
        ],
        peerCount: 2,
        roomCode: "HM4826",
        roundId: 0,
        sendFromClient(msg) {
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "join") {
            if (msg.v && msg.v !== 1 && msg.v !== 2 && msg.v !== 3) {
              handleServerMessage({ v: 1, type: "error", code: "protocol_mismatch" });
              return;
            }
            if (msg.roomCode === "NOTFND" || msg.roomCode === "BADRM9") {
              handleServerMessage({ v: 1, type: "error", code: "room_not_found" });
              return;
            }
            if (msg.roomCode === "FULL01" || msg.roomCode === "MAX999") {
              handleServerMessage({ v: 1, type: "error", code: "room_full" });
              return;
            }
            if (msg.roomCode === "STRT01" || msg.roomCode === "STRT99") {
              handleServerMessage({ v: 1, type: "error", code: "room_started" });
              return;
            }
            if (msg.roomCode === "EXPIRD" || msg.roomCode === "EXP999") {
              handleServerMessage({ v: 1, type: "error", code: "room_expired" });
              return;
            }
            const myId = (msg.token || "guest:Nam").replace(/^guest:/, "");
            this.peers[0].id = myId;
            this.peers[0].name = myId;
            this.peers[0].characterId = onlineState.characterId || "nam_lang";
            this.peers[0].weaponId = onlineState.weaponId || "dep_to_ong";
            if (msg.roomCode && msg.roomCode.length === 6) this.roomCode = msg.roomCode;
            const activePeers = this.peers.slice(0, this.peerCount);
            handleServerMessage({
              v: 1,
              type: "room_state",
              protocolVersion: 1,
              roomCode: this.roomCode,
              hostId: this.peers[0].id,
              started: this.roundId > 0,
              reconnectToken: "loopback_rtok_" + Date.now(),
              players: activePeers.map((p, i) => ({
                id: p.id, name: p.name, slot: i + 1, ready: p.ready,
                characterId: p.characterId, weaponId: p.weaponId
              })),
              config: { maxPlayers: 6, minPlayersToStart: 2, startHp: 3, placeSeconds: 5, maxRounds: 5 }
            });
          } else if (msg.type === "room_ready") {
            this.peers[0].ready = !!msg.ready;
            this.peers[0].characterId = onlineState.characterId;
            this.peers[0].weaponId = onlineState.weaponId;
            const activePeers = this.peers.slice(0, this.peerCount);
            handleServerMessage({
              v: 1,
              type: "room_state",
              protocolVersion: 1,
              roomCode: this.roomCode,
              hostId: this.peers[0].id,
              started: false,
              players: activePeers.map((p, i) => ({
                id: p.id, name: p.name, slot: i + 1, ready: p.ready,
                characterId: p.characterId, weaponId: p.weaponId
              })),
              config: { maxPlayers: 6, minPlayersToStart: 2, startHp: 3, placeSeconds: 5, maxRounds: 5 }
            });
          } else if (msg.type === "start") {
            if (this.peerCount < 2) {
              handleServerMessage({ v: 1, type: "error", code: "not_enough_players" });
              return;
            }
            this.roundId = 1;
            this.peers.forEach(p => { p.hp = 3; p.hitsLanded = 0; p.alive = true; });
            handleServerMessage({
              v: 1,
              type: "round_start",
              roundId: this.roundId,
              deadline: Date.now() + 5000
            });
          } else if (msg.type === "commit") {
            onlineState.hasCommittedThisRound = true;
          } else if (msg.type === "lock_ready") {
            onlineState.isLockedThisRound = true;
            this.resolveCurrentRound();
          } else if (msg.type === "emote") {
            handleServerMessage({
              v: 1,
              type: "emote",
              playerId: this.peers[0].id,
              emoteId: msg.emoteId || "happy",
              phase: onlineState.phase === "reveal" ? "reveal" : "placing"
            });
          } else if (msg.type === "quick_match") {
            handleServerMessage({ v: 1, type: "quick_match_waiting", quickMatchHintSeconds: 30 });
          } else if (msg.type === "leave") {
            handleServerMessage({ v: 1, type: "quick_match_left" });
          }
        },
        resolveCurrentRound() {
          const r = Math.max(1, this.roundId || 1);
          const p1 = this.peers[0];
          const p2 = this.peers[1];
          handleServerMessage({
            v: 1,
            type: "reveal",
            roundId: r,
            players: [
              { id: p1.id, position: { x: onlineState.myPos.x, y: onlineState.myPos.y }, aim: { x: onlineState.myAim.x, y: onlineState.myAim.y } },
              { id: p2.id, position: { x: 1.65, y: 0.15 }, aim: { x: -1.0, y: 0.0 } }
            ]
          });
          setTimeout(() => {
            p2.hp = Math.max(0, p2.hp - 1);
            p1.hitsLanded = (p1.hitsLanded || 0) + 1;
            if (p2.hp <= 0) p2.alive = false;
            handleServerMessage({
              v: 1,
              type: "round_result",
              roundId: r,
              hits: [{ shooterId: p1.id, targetId: p2.id, point: { x: 1.4, y: 0.1 }, distance: 3.0 }],
              players: [
                { id: p1.id, hp: p1.hp, eliminated: !p1.alive },
                { id: p2.id, hp: p2.hp, eliminated: !p2.alive }
              ]
            });
            setTimeout(() => {
              if (!p2.alive || r >= 5) {
                handleServerMessage({
                  v: 1,
                  type: "match_end",
                  winners: [p1.id],
                  winnerIds: [p1.id],
                  rankings: [
                    { playerId: p1.id, name: p1.name, rank: 1, hp: p1.hp, hitsLanded: p1.hitsLanded, hits: p1.hitsLanded, throws: r, goldReward: 30 },
                    { playerId: p2.id, name: p2.name, rank: 2, hp: p2.hp, hitsLanded: p2.hitsLanded, hits: p2.hitsLanded, throws: r, goldReward: 10 }
                  ]
                });
              } else {
                this.roundId = r + 1;
                handleServerMessage({
                  v: 1,
                  type: "round_start",
                  roundId: this.roundId,
                  deadline: Date.now() + 5000
                });
              }
            }, 1300);
          }, 900);
        }
      };

      // L4: Mobile Lifecycle, Ping Heartbeat, and Screen Wake Lock
      let _heartbeatTimer = null;
      let _lastPingTime = 0;
      let _lastPongTime = 0;

      function startHeartbeat() {
        stopHeartbeat();
        _lastPongTime = Date.now();
        _heartbeatTimer = setInterval(() => {
          if (onlineState.transportMode === "loopback") return;
          if (onlineState.socket && onlineState.socket.readyState === WebSocket.OPEN) {
            _lastPingTime = Date.now();
            onlineState.socket.send(JSON.stringify({ v: 1, type: "ping" }));
            if (_lastPingTime - _lastPongTime > 15000) {
              console.warn("[HITME Net] 15s without pong — closing stale connection");
              try { onlineState.socket.close(4000, "stale_heartbeat"); } catch (e) {}
            }
          }
        }, 5000);
      }

      function stopHeartbeat() {
        if (_heartbeatTimer) {
          clearInterval(_heartbeatTimer);
          _heartbeatTimer = null;
        }
      }

      let _wakeLock = null;
      async function requestWakeLock() {
        if ("wakeLock" in navigator && navigator.wakeLock && navigator.wakeLock.request) {
          try {
            if (!_wakeLock) {
              _wakeLock = await navigator.wakeLock.request("screen");
              _wakeLock.addEventListener("release", () => { _wakeLock = null; });
            }
          } catch (e) {}
        }
      }

      function releaseWakeLock() {
        if (_wakeLock) {
          try { _wakeLock.release(); } catch (e) {}
          _wakeLock = null;
        }
      }

      async function runNetDiagnostics(wsUrl) {
        const urlParams = new URLSearchParams(window.location.search);
        const mockNet = urlParams.get("mock_net");
        if (mockNet === "origin") {
          return {
            code: "NET-ORIGIN",
            message: "Máy chủ Render từ chối nguồn gốc kết nối (HTTP 403 Forbidden). Cần cập nhật ALLOWED_ORIGINS trên máy chủ Render để cho phép nguồn gốc này.",
            details: `Origin: ${location.origin}
WebSocket URL: ${wsUrl}
HTTP Status: 403 Forbidden
Protocol: 3
Host: hitmegame.onrender.com
User-Agent: ${navigator.userAgent}`
          };
        }
        if (mockNet === "sleep") {
          return {
            code: "NET-SLEEP",
            message: "Máy chủ Render đang ngủ (gói miễn phí tự tắt khi không có khách). Vui lòng đợi 30–60 giây để máy chủ khởi động.",
            details: `Origin: ${location.origin}
WebSocket URL: ${wsUrl}
HTTP Status: 503 / Timeout (Sleeping)
Host: hitmegame.onrender.com`
          };
        }
        if (mockNet === "proto") {
          return {
            code: "NET-PROTO",
            message: "Phiên bản giao thức không khớp giữa client và server.",
            details: `Client Protocol: 3
Server Protocol: Mismatch
Target WS: ${wsUrl}`
          };
        }
        if (mockNet === "ws") {
          return {
            code: "NET-WS",
            message: "Không thể mở kết nối WebSocket tới máy chủ.",
            details: `Target WS: ${wsUrl}
State: Closed/Error
Network Online: ${navigator.onLine}`
          };
        }

        const diagStart = Date.now();
        let healthOk = false;
        let serverProto = null;
        let httpStatus = 0;
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 4000);
          try {
            const res = await fetch("https://hitmegame.onrender.com/healthz", { signal: ctrl.signal, cache: "no-store" });
            httpStatus = res.status;
            if (res.ok) {
              const data = await res.json();
              healthOk = data.status === "ok";
              serverProto = data.protocol;
            }
          } catch (eCors) {
            // Render /healthz lacks Access-Control-Allow-Origin header; test via no-cors mode
            try {
              const resNoCors = await fetch("https://hitmegame.onrender.com/healthz", { signal: ctrl.signal, cache: "no-store", mode: "no-cors" });
              if (resNoCors && (resNoCors.type === "opaque" || resNoCors.ok)) {
                httpStatus = 200;
                healthOk = true;
                serverProto = 3;
              }
            } catch (eSleep) {
              httpStatus = 0;
            }
          }
          clearTimeout(t);
        } catch (err) {
          httpStatus = 0;
        }

        const dt = Date.now() - diagStart;
        const diagLog = `Timestamp: ${new Date().toISOString()}
Origin: ${location.origin}
WebSocket URL: ${wsUrl}
HTTP /healthz: ${httpStatus ? `HTTP ${httpStatus} (${dt}ms)` : `Unreachable / Timeout (${dt}ms)`}
Server Protocol: ${serverProto ?? "Unknown"}
Client Version: ${window.__hitmeReleaseInfo?.version || "0.1.0-beta.12"}
User-Agent: ${navigator.userAgent}`;

        if (!httpStatus || httpStatus >= 500) {
          return {
            code: "NET-SLEEP",
            message: "Máy chủ Render đang tạm ngủ (gói miễn phí tự tắt khi không có khách). Đang kích hoạt đánh thức máy chủ, vui lòng đợi 30–60 giây...",
            details: diagLog
          };
        }
        if (healthOk && (serverProto === 1 || serverProto === 2 || serverProto === 3)) {
          return {
            code: "NET-ORIGIN",
            message: "Máy chủ Render đang chạy nhưng từ chối nguồn gốc kết nối (HTTP 403 Forbidden). Nguồn gốc " + location.origin + " chưa có trong ALLOWED_ORIGINS của máy chủ.",
            details: diagLog
          };
        }
        return {
          code: "NET-WS",
          message: "Không thể kết nối WebSocket tới máy chủ lúc này. Vui lòng thử lại hoặc Luyện với bot.",
          details: diagLog
        };
      }

      async function triggerNetDiagnostics() {
        if (onlineState._connectTimer) { clearInterval(onlineState._connectTimer); onlineState._connectTimer = null; }
        const diag = await runNetDiagnostics(onlineState.wsUrl);
        onlineState.diagResult = diag;
        onlineState.lastErrorCode = diag.code;
        onlineState.lastErrorText = diag.message;
        renderOnlineRoot();
        if (diag.code === "NET-SLEEP" && !onlineState._wakePoll) {
          onlineState._wakePoll = setInterval(async () => {
            if (onlineState.screen !== "search" && onlineState.screen !== "lobby") {
              clearInterval(onlineState._wakePoll);
              onlineState._wakePoll = null;
              return;
            }
            try {
              const res = await fetch("https://hitmegame.onrender.com/healthz", { cache: "no-store" });
              if (res.ok) {
                clearInterval(onlineState._wakePoll);
                onlineState._wakePoll = null;
                await triggerNetDiagnostics();
              }
            } catch (e) {}
          }, 4000);
        }
      }

      function connectSocket(onOpenSendMsg) {
        if (onlineState.transportMode === "loopback") {
          onlineState.connected = true;
          if (onOpenSendMsg) loopbackHub.sendFromClient(onOpenSendMsg);
          return;
        }
        if (onlineState.socket) {
          try {
            onlineState.socket.onopen = null;
            onlineState.socket.onmessage = null;
            onlineState.socket.onclose = null;
            onlineState.socket.onerror = null;
            if (onlineState.socket.readyState === WebSocket.OPEN || onlineState.socket.readyState === WebSocket.CONNECTING) {
              onlineState.socket.close();
            }
          } catch (e) {}
          onlineState.socket = null;
        }

        const ws = new WebSocket(onlineState.wsUrl);
        onlineState.socket = ws;
        ws.onopen = () => {
          onlineState.connected = true;
          hideNetAlert();
          startHeartbeat();
          if (onOpenSendMsg) {
            ws.send(JSON.stringify(onOpenSendMsg));
          }
          renderOnlineRoot();
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(String(ev.data || "{}"));
            handleServerMessage(msg);
          } catch (e) {}
        };
        ws.onclose = (ev) => {
          onlineState.connected = false;
          stopHeartbeat();
          const reason = String(ev.reason || "");
          if (reason === "server_shutdown" || reason === "server_restarting") {
            showNetAlert("server_shutdown", localizeError("server_shutdown"));
          } else if (reason === "session_replaced") {
            showNetAlert("session_replaced", localizeError("session_replaced"));
          } else if (onlineState.phase !== "disconnected" && onlineState.phase !== "match_end" && onlineState.reconnectToken) {
            startReconnectCountdown(30);
          } else if (!onlineState.roomCode && (onlineState.mode === "create" || onlineState.mode === "lobby" || onlineState.mode === "join" || onlineState.mode === "quick")) {
            triggerNetDiagnostics();
          }
          renderOnlineRoot();
        };
        ws.onerror = () => {
          if (!onlineState.connected && !onlineState.roomCode) {
            triggerNetDiagnostics();
          }
        };
      }

      function sendProtocol(msg) {
        const payload = Object.assign({ v: 1 }, msg);
        if (onlineState.transportMode === "loopback") {
          loopbackHub.sendFromClient(payload);
          return;
        }
        if (onlineState.socket && onlineState.socket.readyState === WebSocket.OPEN) {
          onlineState.socket.send(JSON.stringify(payload));
        } else {
          connectSocket(payload);
        }
      }

      function handleServerMessage(msg) {
        if (!msg || typeof msg !== "object") return;
        const t = msg.type;
        if (t === "hello") {
          return;
        }
        if (t === "pong") {
          _lastPongTime = Date.now();
          if (_lastPingTime > 0) {
            window.__hitmeLastRttMs = _lastPongTime - _lastPingTime;
          }
          return;
        }
        if (t === "room_state") {
          if (msg.protocolVersion && msg.protocolVersion !== 1 && msg.protocolVersion !== 2 && msg.protocolVersion !== 3) {
            showNetAlert("protocol_mismatch", localizeError("protocol_mismatch"));
            return;
          }
          onlineState.lastErrorCode = "";
          onlineState.lastErrorText = "";
          onlineState.roomCode = msg.roomCode || onlineState.roomCode;
          onlineState.hostId = msg.hostId || "";
          onlineState.started = !!msg.started;
          if (msg.reconnectToken) saveReconnectToken(msg.reconnectToken);
          onlineState.players = Array.isArray(msg.players) ? msg.players : [];
          if (!msg.started || onlineState.phase === "disconnected" || onlineState.phase === "queueing") {
            onlineState.phase = "lobby";
            onlineState.mode = "lobby";
            const allRdy = onlineState.players.length >= 2 && onlineState.players.every(p => p.ready);
            onlineState.countdownSec = allRdy ? 3 : 0;
          }
          hideNetAlert();
          renderOnlineRoot();
          return;
        }
        if (t === "quick_match_waiting") {
          onlineState.phase = "queueing";
          onlineState.mode = "quick";
          onlineState.quickWaitSec = 0;
          onlineState.quickHintShown = false;
          if (_quickWaitTimer) clearInterval(_quickWaitTimer);
          _quickWaitTimer = setInterval(() => {
            onlineState.quickWaitSec++;
            renderOnlineRoot();
          }, 1000);
          renderOnlineRoot();
          return;
        }
        if (t === "quick_match_hint") {
          onlineState.quickHintShown = true;
          renderOnlineRoot();
          return;
        }
        if (t === "quick_match_left") {
          if (_quickWaitTimer) { clearInterval(_quickWaitTimer); _quickWaitTimer = null; }
          onlineState.phase = "disconnected";
          onlineState.mode = "create";
          renderOnlineRoot();
          return;
        }
        if (t === "round_start") {
          if (_quickWaitTimer) { clearInterval(_quickWaitTimer); _quickWaitTimer = null; }
          requestWakeLock();
          onlineState.lastErrorCode = "";
          onlineState.lastErrorText = "";
          onlineState.phase = "placing";
          onlineState.mode = "match";
          onlineState.roundId = Number(msg.roundId) || 1;
          onlineState.deadlineMs = Number(msg.deadline) || (Date.now() + 5000);
          onlineState.hasCommittedThisRound = false;
          onlineState.isLockedThisRound = false;
          onlineState.revealedPlayers = [];
          onlineState.emotesByPlayer = {};
          hideNetAlert();
          renderOnlineRoot();
          return;
        }
        if (t === "reveal") {
          onlineState.lastErrorCode = "";
          onlineState.lastErrorText = "";
          onlineState.phase = "reveal";
          onlineState.mode = "match";
          onlineState.revealedPlayers = Array.isArray(msg.players) ? msg.players : [];
          renderOnlineRoot();
          return;
        }
        if (t === "round_result") {
          onlineState.lastErrorCode = "";
          onlineState.lastErrorText = "";
          onlineState.phase = "round_result";
          onlineState.mode = "match";
          onlineState.lastRoundResult = msg;
          if (Array.isArray(msg.players)) {
            msg.players.forEach(rp => {
              const p = onlineState.players.find(x => x.id === rp.id);
              if (p) {
                p.hp = rp.hp;
                p.eliminated = rp.eliminated;
              }
            });
          }
          renderOnlineRoot();
          return;
        }
        if (t === "match_end") {
          releaseWakeLock();
          onlineState.lastErrorCode = "";
          onlineState.lastErrorText = "";
          onlineState.phase = "match_end";
          onlineState.mode = "result";
          onlineState.lastMatchEnd = msg;
          renderOnlineRoot();
          return;
        }
        if (t === "emote") {
          onlineState.emotesByPlayer[msg.playerId] = {
            emoteId: msg.emoteId,
            visibleOnCharacter: onlineState.phase === "reveal" || msg.phase === "reveal",
            at: Date.now()
          };
          renderOnlineRoot();
          return;
        }
        if (t === "error") {
          const code = msg.code || "unknown_type";
          const txt = localizeError(code, msg.remainingSeconds);
          onlineState.lastErrorCode = code;
          onlineState.lastErrorText = txt;
          const isModalAlert = code === "server_restarting" || code === "server_shutdown" ||
                               code === "protocol_mismatch" || code === "banned" ||
                               code === "session_replaced" || code === "reconnect_invalid" ||
                               code === "room_full" || code === "room_started" ||
                               code === "room_not_found" || code === "room_expired" ||
                               code === "room_limit" || code === "room_code_exhausted";
          if (isModalAlert) {
            showNetAlert(code, txt);
          }
          renderOnlineRoot();
          return;
        }
      }

      let _reconnectBackoffMs = 1000;
      function startReconnectCountdown(seconds) {
        if (_reconnectTimer) clearInterval(_reconnectTimer);
        onlineState.reconnectSecLeft = seconds || 30;
        _reconnectBackoffMs = 1000;
        showNetAlert("reconnecting", `Mất kết nối mạng — đang tự động vào lại phòng (${onlineState.reconnectSecLeft}s)...`);

        function attemptAutoRetry() {
          if (onlineState.reconnectSecLeft <= 0 || !onlineState.reconnectToken) return;
          const jitter = Math.floor(Math.random() * 500);
          setTimeout(() => {
            if (onlineState.reconnectSecLeft > 0 && !onlineState.connected) {
              triggerReconnectNow();
              _reconnectBackoffMs = Math.min(8000, _reconnectBackoffMs * 2);
            }
          }, jitter);
        }

        _reconnectTimer = setInterval(() => {
          onlineState.reconnectSecLeft = Math.max(0, onlineState.reconnectSecLeft - 1);
          if (onlineState.reconnectSecLeft <= 0) {
            clearInterval(_reconnectTimer);
            _reconnectTimer = null;
            closeOnlineRoot();
            showNetAlert("reconnect_timeout", "Bạn đã rời trận do mất kết nối quá 30 giây.");
          } else {
            showNetAlert("reconnecting", `Mất kết nối mạng — đang tự động vào lại phòng (${onlineState.reconnectSecLeft}s)...`);
            if (onlineState.reconnectSecLeft % 3 === 0) {
              attemptAutoRetry();
            }
          }
        }, 1000);
      }

      function triggerReconnectNow() {
        const rtok = loadReconnectToken();
        if (!rtok) {
          showNetAlert("reconnect_invalid", localizeError("reconnect_invalid"));
          return;
        }
        connectSocket({
          v: 1,
          type: "join",
          token: getToken(),
          reconnectToken: rtok
        });
      }

      function showNetAlert(code, messageText) {
        let shade = document.getElementById("r39-net-alert-shade");
        if (!shade) {
          shade = document.createElement("div");
          shade.id = "r39-net-alert-shade";
          document.body.appendChild(shade);
        }
        const isMismatch = code === "protocol_mismatch";
        const isReconnecting = code === "reconnecting";
        const isShutdown = code === "server_shutdown" || code === "server_restarting";
        const isBanned = code === "banned";
        const isTimeout = code === "reconnect_timeout" || code === "reconnect_invalid";
        const isRoomJoinError = code === "room_full" || code === "room_started" || code === "room_not_found" || code === "room_expired" || code === "room_limit" || code === "room_code_exhausted";
        const title = isMismatch ? "CÓ BẢN MỚI — VUI LÒNG TẢI LẠI"
                    : isReconnecting ? "ĐANG KẾT NỐI LẠI (30 GIÂY)"
                    : isShutdown ? "MÁY CHỦ ĐANG BẢO TRÌ, THỬ LẠI SAU ÍT PHÚT"
                    : isBanned ? "TẠM KHÓA DO KHÔNG THAO TÁC (AFK)"
                    : isTimeout ? "BẠN ĐÃ RỜI TRẬN"
                    : isRoomJoinError ? "KHÔNG THỂ VÀO PHÒNG"
                    : "THÔNG BÁO KẾT NỐI";
        shade.innerHTML = `
          <div class="r38-online-sheet" role="dialog" aria-modal="true" data-alert-code="${code}">
            <h3>${title}</h3>
            <p>${messageText}</p>
            <div class="r38-online-actions">
              ${isMismatch ? `<button type="button" class="r39-btn" id="r39-alert-reload-btn">TẢI LẠI NGAY</button>` : ""}
              ${isRoomJoinError ? `<button type="button" class="r39-btn" id="r39-alert-newroom-btn">TẠO PHÒNG MỚI</button>` : ""}
              ${isReconnecting ? `<button type="button" class="r39-btn" id="r39-alert-reconnect-btn">VÀO LẠI NGAY</button>` : ""}
              <button type="button" class="r39-btn ${isRoomJoinError || isMismatch ? "secondary" : ""}" id="r39-alert-bot-btn">LUYỆN VỚI BOT</button>
              <button type="button" class="r39-btn secondary" id="r39-alert-close-btn">${isTimeout || isShutdown ? "VỀ TRANG CHỦ" : "ĐÓNG"}</button>
            </div>
          </div>
        `;
        shade.classList.add("active");
        const reloadBtn = shade.querySelector("#r39-alert-reload-btn");
        if (reloadBtn) reloadBtn.addEventListener("click", () => {
          window.location.href = window.location.origin + window.location.pathname + "?_t=" + Date.now();
        });
        const newRoomBtn = shade.querySelector("#r39-alert-newroom-btn");
        if (newRoomBtn) newRoomBtn.addEventListener("click", () => {
          hideNetAlert();
          openMode("create");
        });
        const recBtn = shade.querySelector("#r39-alert-reconnect-btn");
        if (recBtn) recBtn.addEventListener("click", () => triggerReconnectNow());
        const botBtn = shade.querySelector("#r39-alert-bot-btn");
        if (botBtn) botBtn.addEventListener("click", () => {
          hideNetAlert();
          closeOnlineRoot();
          const prac = document.querySelector('#ui-root [data-action="practice"]');
          if (prac) prac.click();
        });
        const clsBtn = shade.querySelector("#r39-alert-close-btn");
        if (clsBtn) clsBtn.addEventListener("click", () => {
          hideNetAlert();
          if (isShutdown || isTimeout) closeOnlineRoot();
        });
      }

      function startReleasePolling() {
        const myBuildId = window.__hitmeReleaseInfo?.buildId || "";
        setInterval(() => {
          if (document.hidden) return;
          fetch("./release.json?_t=" + Date.now(), { cache: "no-store" })
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data && data.buildId && myBuildId && data.buildId !== myBuildId && !document.getElementById("r40-update-toast")) {
                showUpdateToast(data.buildId);
              }
            })
            .catch(() => {});
        }, 60000);
      }

      function showUpdateToast(newBuildId) {
        if (document.getElementById("r40-update-toast")) return;
        const toast = document.createElement("div");
        toast.id = "r40-update-toast";
        toast.className = "r40-update-toast";
        toast.innerHTML = `
          <span>Có bản cập nhật mới!</span>
          <button type="button" class="r39-btn-pill" id="r40-toast-reload-btn" style="padding:4px 10px;font-size:11.5px;">TẢI LẠI</button>
        `;
        document.body.appendChild(toast);
        toast.querySelector("#r40-toast-reload-btn").addEventListener("click", () => {
          window.location.href = window.location.origin + window.location.pathname + "?_t=" + Date.now();
        });
      }

      let _lastHiddenAt = 0;
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          _lastHiddenAt = Date.now();
        } else if (document.visibilityState === "visible") {
          _lastHiddenAt = 0;
          if (onlineState.mode === "match") {
            requestWakeLock();
          }
          if (onlineState.mode === "match" && (!onlineState.socket || onlineState.socket.readyState !== WebSocket.OPEN) && onlineState.transportMode !== "loopback") {
            triggerReconnectNow();
          }
        }
      });

      window.addEventListener("pagehide", () => {
        releaseWakeLock();
      });

      window.addEventListener("pageshow", (ev) => {
        if (ev.persisted && onlineState.mode === "match" && onlineState.transportMode !== "loopback") {
          triggerReconnectNow();
        }
      });

      window.addEventListener("offline", () => {
        if (onlineState.mode === "match" || onlineState.mode === "lobby") {
          startReconnectCountdown(30);
        }
      });

      window.addEventListener("online", () => {
        if (onlineState.reconnectSecLeft > 0) {
          const jitter = 100 + Math.floor(Math.random() * 400);
          setTimeout(() => triggerReconnectNow(), jitter);
        }
      });

      function hideNetAlert() {
        if (_reconnectTimer) { clearInterval(_reconnectTimer); _reconnectTimer = null; }
        const shade = document.getElementById("r39-net-alert-shade");
        if (shade) shade.classList.remove("active");
      }

      function ensureOnlineRoot() {
        let el = document.getElementById("r39-online-root");
        if (!el) {
          el = document.createElement("div");
          el.id = "r39-online-root";
          document.body.appendChild(el);
        }
        return el;
      }

      function closeOnlineRoot() {
        const el = document.getElementById("r39-online-root");
        if (el) el.classList.remove("active");
        if (_tickTimer) { clearInterval(_tickTimer); _tickTimer = null; }
      }

      function _doOpenMode(mode) {
        onlineState.mode = mode || "create";
        onlineState.lastErrorCode = "";
        onlineState.lastErrorText = "";
        const el = ensureOnlineRoot();
        el.classList.add("active");
        if (!_tickTimer) {
          _tickTimer = setInterval(() => {
            if (onlineState.phase === "placing" && onlineState.deadlineMs > 0) {
              const sec = Math.max(0, Math.ceil((onlineState.deadlineMs - Date.now()) / 1000));
              if (sec !== onlineState.secondsLeft) {
                onlineState.secondsLeft = sec;
                const timerEl = document.getElementById("r39-live-sec");
                if (timerEl) timerEl.textContent = sec + "s";
              }
            }
          }, 200);
        }
        if (mode === "quick") {
          onlineState.quickWaitSec = 0;
          onlineState.quickHintShown = false;
          if (_quickWaitTimer) clearInterval(_quickWaitTimer);
          _quickWaitTimer = setInterval(() => {
            onlineState.quickWaitSec = (onlineState.quickWaitSec || 0) + 1;
            const qEl = document.getElementById("r40-quick-timer");
            if (qEl) qEl.textContent = onlineState.quickWaitSec + " giây";
            if (onlineState.quickWaitSec >= 30 && !onlineState.quickHintShown) {
              onlineState.quickHintShown = true;
              renderOnlineRoot();
            }
          }, 1000);
          sendProtocol({ type: "quick_match", token: getToken(), clientVersion: window.__hitmeReleaseInfo?.version || "0.1.0-beta.11" });
        } else if (mode === "create") {
          onlineState.connectWaitSec = 0;
          if (onlineState._connectTimer) clearInterval(onlineState._connectTimer);
          onlineState._connectTimer = setInterval(() => {
            onlineState.connectWaitSec = (onlineState.connectWaitSec || 0) + 1;
            const cEl = document.getElementById("r40-connect-timer");
            if (cEl) cEl.textContent = onlineState.connectWaitSec + "s";
          }, 1000);
          if (onlineState._createTimeout) clearTimeout(onlineState._createTimeout);
          onlineState._createTimeout = setTimeout(() => {
            if (!onlineState.roomCode && (onlineState.mode === "create" || onlineState.mode === "lobby")) {
              triggerNetDiagnostics();
            }
          }, 8000);
          if (new URLSearchParams(location.search).has("mock_net")) {
            setTimeout(() => triggerNetDiagnostics(), 300);
          }
          sendProtocol({
            type: "join",
            token: getToken(),
            characterId: onlineState.characterId,
            weaponId: onlineState.weaponId,
            clientVersion: window.__hitmeReleaseInfo?.version || "0.1.0-beta.11"
          });
        }
        renderOnlineRoot();
      }

      function openMode(mode) {
        const prof = LocalProfileStore.getProfile() || {};
        if (!prof.customized && !window.__hitmeNamePromptedThisSession) {
          window.__hitmeNamePromptedThisSession = true;
          openNameModal(() => {
            _doOpenMode(mode);
          });
          return;
        }
        _doOpenMode(mode);
      }

          const resScreen = document.querySelector('#ui-root [data-screen="result"]') || document.querySelector('[data-screen="result"]');

            ? rawEvt.players.map((p, idx) => ({
                playerId: p.id || ("p" + idx),
                name: p.name || (idx === 0 ? "Bạn" : ("Bot " + idx)),
                hp: p.hp ?? (idx === 0 ? 3 : (idx === 1 ? 3 : 0)),
                hitsLanded: p.hits ?? (idx === 0 ? 2 : (idx === 1 ? 2 : 1)),

              }))

                { playerId: "bot2", name: "Anh Teen", hp: 1, hitsLanded: 1, goldReward: 15 },
                { playerId: "bot3", name: "Nữ Năng Động", hp: 0, hitsLanded: 0, goldReward: 5 }
              ];
          const ranked = computeCoRankings(samplePlayers);
          wrap.innerHTML = `
            <div style="font-size:12px;font-weight:900;color:#ffcd38;margin-bottom:4px;">BẢNG XẾP HẠNG CHI TIẾT (ĐỒNG HẠNG THEO LUẬT v1.2)</div>

      document.addEventListener("click", (ev) => {
        const keyBtn = ev.target.closest ? ev.target.closest("[data-key]") : null;
        if (keyBtn) {
          const ch = keyBtn.dataset.key || "";
          if (onlineState.joinInputCode.length < 6 && KEYPAD_CHARS.includes(ch)) {
            onlineState.joinInputCode += ch;
            renderOnlineRoot();
          }
          return;
        }
        const charBtn = ev.target.closest ? ev.target.closest("[data-char-pick]") : null;
        if (charBtn) {
          const cid = charBtn.dataset.charPick || "nam_lang";
          if (charBtn.classList.contains("taken")) {
            onlineState.lastErrorCode = "duplicate_player";
            onlineState.lastErrorText = localizeError("duplicate_player");
            renderOnlineRoot();
            return;
          }
          onlineState.characterId = cid;
          onlineState.hasConfirmedCharInLobby = true;
          onlineState.lastErrorText = "";
          renderOnlineRoot();
          return;
        }
        const weapBtn = ev.target.closest ? ev.target.closest("[data-weapon-pick]") : null;
        if (weapBtn) {
          onlineState.weaponId = weapBtn.dataset.weaponPick || "dep_to_ong";
          renderOnlineRoot();
          return;
        }
        const emoteBtn = ev.target.closest ? ev.target.closest("[data-emote]") : null;
        if (emoteBtn) {
          sendProtocol({ type: "emote", emoteId: emoteBtn.dataset.emote || "happy" });
          return;
        }
        const labBtn = ev.target.closest ? ev.target.closest("[data-lab]") : null;
        if (labBtn) {
          const act = labBtn.dataset.lab;
          if (act === "1p") {
            loopbackHub.peerCount = 1;
            loopbackHub.sendFromClient({ type: "join", token: getToken() });
            loopbackHub.sendFromClient({ type: "start" });
          } else if (act === "2p") {
            loopbackHub.peerCount = 2;
            loopbackHub.peers[0].ready = true;
            loopbackHub.peers[1].ready = true;
            loopbackHub.sendFromClient({ type: "join", token: getToken() });
          } else if (act === "reconnect") {
            startReconnectCountdown(30);
          } else if (act === "shutdown") {
            handleServerMessage({ v: 1, type: "error", code: "server_restarting" });
          } else if (act === "mismatch") {
            handleServerMessage({ v: 1, type: "error", code: "protocol_mismatch" });
          } else if (act === "afk") {
            handleServerMessage({ v: 1, type: "error", code: "banned", remainingSeconds: 120 });
          }
          return;
        }
        const onAct = ev.target.closest ? ev.target.closest("[data-on-act]") : null;
        if (onAct) {
          const act = onAct.dataset.onAct;
          if (act === "close-online") {
            closeOnlineRoot();
          } else if (act === "open-rename") {
            openNameModal();
          } else if (act === "open-profile-shop") {
            openProfileShopModal();
          } else if (act === "open-inmatch-settings") {
            openInMatchSettingsModal();
          } else if (act === "switch-join") {
            onlineState.mode = "join";
            renderOnlineRoot();
          } else if (act === "switch-create" || act === "do-create-room") {
            openMode("create");
          } else if (act === "do-quick-match") {
            openMode("quick");
          } else if (act === "retry-connect") {
            onlineState.lastErrorText = "";
            renderOnlineRoot();
            openMode(onlineState.mode || "create");
          } else if (act === "start-lab-mode") {
            onlineState.transportMode = "loopback";
            onlineState.lastErrorCode = "";
            onlineState.lastErrorText = "";
            onlineState.mode = "lobby";
            onlineState.phase = "lobby";
            loopbackHub.peerCount = 2;
            loopbackHub.peers[0].ready = true;
            loopbackHub.peers[1].ready = false;
            connectSocket({ type: "join", token: getToken() });
            renderOnlineRoot();
          } else if (act === "copy-diag") {
            const isOriginErr = onlineState.lastErrorCode === "NET-ORIGIN";
            const txt = isOriginErr
              ? "ALLOWED_ORIGINS=https://hitmegame-iota.vercel.app,http://localhost,http://127.0.0.1"
              : (onlineState.diagResult?.details || onlineState.lastErrorText || "No diagnostic details");
            try {
              navigator.clipboard?.writeText(txt);
              showNetAlert("diag_copied", isOriginErr ? "Đã chép cấu hình ALLOWED_ORIGINS cho Render!" : "Đã sao chép thông tin chẩn đoán mạng vào bộ nhớ tạm!");
            } catch (e) {}
          } else if (act === "go-bot") {
            closeOnlineRoot();
            if (window.hitmeUi && typeof window.hitmeUi.onUnity === "function") {
              window.hitmeUi.onUnity({ type: "screen", name: "bot" });
            }
          } else if (act === "back-key") {
            onlineState.joinInputCode = onlineState.joinInputCode.slice(0, -1);
            renderOnlineRoot();
          } else if (act === "clear-code") {
            onlineState.joinInputCode = "";
            renderOnlineRoot();
          } else if (act === "paste-code") {
            if (navigator.clipboard && navigator.clipboard.readText) {
              navigator.clipboard.readText().then(txt => {
                const cleaned = String(txt || "").toUpperCase().replace(/[^2-9A-HJ-KM-NP-Z]/g, "").slice(0, 6);
                if (cleaned) {
                  onlineState.joinInputCode = cleaned;
                  renderOnlineRoot();
                }
              }).catch(() => {});
            }
          } else if (act === "submit-join") {
            if (onlineState.joinInputCode.length === 6) {
              sendProtocol({
                type: "join",
                token: getToken(),
                roomCode: onlineState.joinInputCode,
                characterId: onlineState.characterId,
                weaponId: onlineState.weaponId,
                clientVersion: window.__hitmeReleaseInfo?.version || "0.1.0-beta.10"
              });
            }
          } else if (act === "copy-code" || act === "copy-invite-link") {
            const loc = window.location;
            const code = onlineState.roomCode || "";
            const url = loc.origin + loc.pathname + "?join=" + encodeURIComponent(code);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).then(() => {
                if (onAct) {
                  const orig = onAct.textContent;
                  onAct.textContent = "✓ ĐÃ CHÉP!";
                  setTimeout(() => { onAct.textContent = orig; }, 1800);
                }
              }).catch(() => {});
            }
          } else if (act === "share-invite-link") {
            const loc = window.location;
            const code = onlineState.roomCode || "";
            const url = loc.origin + loc.pathname + "?join=" + encodeURIComponent(code);
            if (navigator.share) {
              navigator.share({
                title: "Vào chơi HIT ME cùng mình!",
                text: "Bấm vào liên kết để vào ngay phòng HIT ME (" + code + ") cùng mình nhé!",
                url: url
              }).catch((e) => {
                if (e && e.name !== "AbortError") {
                  if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => {
                      if (onAct) {
                        const orig = onAct.textContent;
                        onAct.textContent = "✓ ĐÃ CHÉP LIÊN KẾT!";
                        setTimeout(() => { onAct.textContent = orig; }, 1800);
                      }
                    }).catch(() => {});
                  }
                }
              });
            } else {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                  if (onAct) {
                    const orig = onAct.textContent;
                    onAct.textContent = "✓ ĐÃ CHÉP LIÊN KẾT!";
                    setTimeout(() => { onAct.textContent = orig; }, 1800);
                  }
                }).catch(() => {});
              }
            }
          } else if (act === "toggle-ready") {
            const me = (onlineState.players || []).find(p => p.id === onlineState.playerName) || onlineState.players[0];
            const nextRdy = !(me && me.ready);
            sendProtocol({
              type: "room_ready",
              ready: nextRdy,
              characterId: onlineState.characterId,
              weaponId: onlineState.weaponId
            });
          } else if (act === "host-start") {
            sendProtocol({ type: "start" });
          } else if (act === "lock-ready") {
            if (!onlineState.hasCommittedThisRound) {
              sendProtocol({
                type: "commit",
                roundId: onlineState.roundId || 1,
                positionX: onlineState.myPos.x,
                positionY: onlineState.myPos.y,
                hasAim: true,
                aimX: onlineState.myAim.x,
                aimY: onlineState.myAim.y
              });
            }
            sendProtocol({ type: "lock_ready", ready: true });
            onlineState.isLockedThisRound = true;
            renderOnlineRoot();
          } else if (act === "leave-quick") {
            sendProtocol({ type: "leave" });
          } else if (act === "go-bot") {
            closeOnlineRoot();
            const prac = document.querySelector('#ui-root [data-action="practice"]');
            if (prac) prac.click();
          } else if (act === "replay-match" || act === "play-again") {
            const isHost = (onlineState.hostId && onlineState.playerName === onlineState.hostId) || (onlineState.players[0] && onlineState.players[0].id === onlineState.playerName) || (onlineState.transportMode === "loopback");
            if (!isHost && act === "replay-match") {
              showNetAlert("host_only", "Chỉ chủ phòng mới có quyền bấm Đấu lại!");
              return;
            }
            sendProtocol({ type: "start" });
          } else if (act === "return-lobby") {
            onlineState.mode = "lobby";
            onlineState.phase = "lobby";
            onlineState.started = false;
            sendProtocol({
              type: "room_ready",
              ready: false,
              characterId: onlineState.characterId,
              weaponId: onlineState.weaponId
            });
            renderOnlineRoot();
          } else if (act === "leave-room") {
            sendProtocol({ type: "leave" });
            closeOnlineRoot();
          } else if (act === "quick-again") {
            sendProtocol({ type: "leave" });
            setTimeout(() => _doOpenMode("quick"), 200);
          }
        }
      });

      function _initOnlineLifecycle() {
        const root = document.getElementById("ui-root");
        if (root && typeof MutationObserver !== "undefined") {
          const obs = new MutationObserver(() => safeRun("enhanceBotResultScreenG9", enhanceBotResultScreenG9));
          obs.observe(root, { childList: true, subtree: true });
        }
        safeRun("renderBetaBanner", renderBetaBanner);
        safeRun("startReleasePolling", startReleasePolling);
        safeRun("renderDebugHudIfEnabled", renderDebugHudIfEnabled);
        setInterval(() => safeRun("renderDebugHudIfEnabled", renderDebugHudIfEnabled), 1000);
        const sp = new URLSearchParams(window.location.search);
        if (sp.get("name")) {
          onlineState.playerName = sp.get("name");
          const p = LocalProfileStore.getProfile() || {};
          p.name = onlineState.playerName;
          p.customized = true;
          LocalProfileStore.saveProfile(p);
          try { sessionStorage.setItem("hitme_online_name", onlineState.playerName); } catch (e) {}
        }
        const rawJoin = sp.get("join") || "";
        const joinCode = rawJoin.toUpperCase().replace(/[^2-9A-HJ-KM-NP-Z]/g, "").slice(0, 6);
        if (joinCode.length === 6) {
          onlineState.joinInputCode = joinCode;
          const prof = LocalProfileStore.getProfile() || {};
          if (!prof.customized) {
            setTimeout(() => {
              openNameModal(() => {
                _doOpenMode("join");
                sendProtocol({
                  type: "join",
                  token: getToken(),
                  roomCode: joinCode,
                  characterId: onlineState.characterId,
                  weaponId: onlineState.weaponId,
                  clientVersion: window.__hitmeReleaseInfo?.version || "0.1.0-beta.10"
                });
              });
            }, 300);
          } else {
            setTimeout(() => {
              _doOpenMode("join");
              sendProtocol({
                type: "join",
                token: getToken(),
                roomCode: joinCode,
                characterId: onlineState.characterId,
                weaponId: onlineState.weaponId,
                clientVersion: window.__hitmeReleaseInfo?.version || "0.1.0-beta.10"
              });
            }, 300);
          }
        } else if (sp.get("lab") === "1" && sp.get("open") === "1") {
          setTimeout(() => _doOpenMode(sp.get("mode") || "create"), 250);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", _initOnlineLifecycle);
      } else {
        _initOnlineLifecycle();
      }

      window.__hitmeOnlineUi = {
        openMode,
        closeOnlineRoot,
        openProfileShopModal,
        openInMatchSettingsModal,
        state: onlineState,
        loopbackHub,
        sendProtocol,
        handleServerMessage,
        triggerReconnectNow,
        showNetAlert,
        hideNetAlert,
        resolveServerWsUrl,
        renderBetaBanner,
        LocalProfileStore,
        validateAndSanitizeName,
        openNameModal,
        fetchGuestToken,
        startHeartbeat,
        stopHeartbeat,
        requestWakeLock,
        releaseWakeLock,
        startReconnectCountdown,
        startReleasePolling,
        showUpdateToast,
        handleClientError,
        showClientErrorModal,
        renderDebugHudIfEnabled,
        getRecentLogs: () => _recentLogs.slice()
      };
    })();
  </script>
